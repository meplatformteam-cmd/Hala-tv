 idb.get('lists').then(c=>{if(c&&c.sig===JSON.stringify(saved)&&c.chans&&c.chans.length&&c.conf){S.conf=c.conf;S.chans=c.chans;S.live=c.chans;S.mv=c.mv||[];S.sr=c.sr||[];S.lv=0;S.acc=c.acc||'';S.cm=1;showHome();prewarm();const fr=()=>{S.cm=1;load(saved).then(()=>{S.cm=0;if(V()=='home')renderHome()}).catch(e=>{S.cm=0;elog('refresh: '+(e&&e.message))})};if(c.ts&&Date.now()-c.ts<2*36e5){setTimeout(()=>{if(V()!='app')fr()},45000)}else setTimeout(fr,6000)}else fresh()}).catch(fresh)}else{focusEl($('.lg.on'));startPair()}
