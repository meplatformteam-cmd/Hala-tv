<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if(window.HalaNative){document.documentElement.className="tv";document.querySelector("meta[name=viewport]").setAttribute("content","width=1920")}</script>
<title>هلا TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--cd:rgba(20,20,22,.9);--ip:#0a0a0a;--ov:#000;--sf:rgba(20,20,22,.7);--bg:#000;--pn:#0c0c0c;--ln:#2a2a2c;--tx:#fff;--mu:#8e8e93;--gold:#fff;--hi:#fff;--mar:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:22px/1.4 Cairo,Tahoma,Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0,var(--b2,#1c1c1e) 0,var(--bg) 70%)}
button,input{font:inherit;color:inherit}:focus{outline:none}
#scene{position:fixed;bottom:0;left:0;width:100%;height:58%;opacity:.06;filter:blur(2px);pointer-events:none}
#login,#home,#page,#app{display:none}
body[data-v=login] #login{display:flex}body[data-v=home] #home{display:flex}body[data-v=page] #page{display:block}body[data-v=app] #app{display:block}
.ruq{font-family:Cairo,Tahoma,Arial,sans-serif;font-weight:700;color:var(--tx);letter-spacing:-.01em}
/* دخول */
#login{height:100%;align-items:center;justify-content:center;position:relative;overflow-y:auto;padding:2.5vh 3vw}
.card0{margin:auto;width:min(1200px,96vw);background:var(--cd);border:1px solid var(--ln);border-radius:36px;padding:clamp(16px,3vh,44px) clamp(24px,4.5vw,84px);backdrop-filter:blur(14px)}
.card0 .ruq{font-size:clamp(56px,11vh,120px);line-height:1.25}
.sub{color:var(--mu);margin:4px 0 clamp(10px,2vh,24px);font-size:clamp(18px,2.6vh,28px)}
.langs{display:flex;gap:14px;margin-bottom:clamp(12px,2.4vh,26px)}
.lg{padding:clamp(6px,1.3vh,14px) 36px;border:2px solid var(--ln);border-radius:999px;cursor:pointer;background:var(--ip);font-size:clamp(20px,3vh,30px)}.lg.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.tabs{display:flex;gap:14px;margin-bottom:clamp(12px,2.4vh,26px)}
.tab,.btn,input{background:var(--ip);border:2px solid var(--ln);border-radius:14px;padding:10px 16px}
.tab{flex:1;text-align:center;cursor:pointer}.tab.on{border-color:var(--gold);color:var(--gold);font-weight:700}
input{width:100%;margin-bottom:12px}
.btn{width:100%;background:var(--mar);border-color:var(--mar);font-weight:900;cursor:pointer;font-size:24px}
.card0 .tab,.card0 .btn,.card0 input{border-radius:20px;padding:clamp(9px,1.8vh,20px) 30px;font-size:clamp(20px,3vh,30px)}
.card0 input{margin-bottom:clamp(8px,1.6vh,18px)}
.card0 .btn{font-size:clamp(24px,3.8vh,40px)}
.card0 #demo{font-size:clamp(18px,2.6vh,26px)!important;color:var(--tx)}
.tab:focus,.btn:focus,input:focus,.pill:focus,.lg:focus,.circ:focus{border-color:var(--hi)!important;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
#go{color:var(--ov)}
.logo{display:block;margin:0 auto clamp(6px,1.6vh,16px);height:clamp(90px,17vh,190px)}
.card0 .sub{text-align:center}
.card0 .langs{justify-content:center}
#err{color:#d0d0d0;min-height:26px;margin-top:6px;font-size:clamp(17px,2.4vh,24px)}
/* رئيسية */
#home{height:100%;flex-direction:column;padding:34px 5vw 24px;position:relative;z-index:2}
#home.tvon{animation:tvon .7s ease-out}
@keyframes tvon{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#home.tvon{animation:none}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
#hi{font-size:clamp(50px,6.4vw,104px);line-height:1.15}
#sub{color:var(--mu);font-size:24px;max-width:46ch;margin-top:4px}
.tw{flex:none;padding:12px 22px;border-radius:22px;background:var(--sf);border:1px solid var(--ln);backdrop-filter:blur(12px);min-width:300px}
#clk{direction:ltr;font-size:52px;font-weight:900;line-height:1.1;text-align:start}#clk small{font-size:22px;color:var(--gold);margin-inline-start:8px}
#dt,#wx,#nt{color:var(--mu);font-size:19px}#wx{color:var(--tx)}#nt{margin-top:2px;color:var(--gold)}
.cd{flex:1;position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#2a2a2d,#0a0a0a);border:2px solid transparent;cursor:pointer;transition:transform .18s,box-shadow .18s}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cd.lv img{object-fit:contain;padding:22%;inset:0 0 25% 0;height:75%}
.cd .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.66);backdrop-filter:blur(10px);font-weight:700;font-size:19px;line-height:1.3;max-height:34%;overflow:hidden}
.cd:focus{transform:scale(1.07) translateY(-8px);border-color:var(--hi);box-shadow:0 22px 50px rgba(0,0,0,.6);z-index:3}
.none{color:var(--mu);padding:16px 4px;font-size:20px}
.pill{background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:8px 26px;cursor:pointer;backdrop-filter:blur(8px)}
/* الرئيسية الجديدة */
.nav{display:flex;gap:2vw;margin-top:2.4vh;height:21vh;min-height:110px}
.tile{flex:1;position:relative;overflow:hidden;border-radius:26px;border:2px solid rgba(255,255,255,.08);cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .18s,box-shadow .18s}
.tile .bgi{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);object-fit:cover;opacity:.18;filter:blur(8px) grayscale(1)}
#wx,#nt,.fvb{filter:grayscale(1)}
.ic svg,.circ svg,.ck svg,.nf2 svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile .lb{position:absolute;inset:0;z-index:2;display:flex;align-items:center;gap:1.6vw;padding:0 2.2vw}
.tile .ic{font-size:clamp(44px,5vw,88px);line-height:1}
.tile .tt{display:flex;flex-direction:column;line-height:1.15}
.tile .ruq{font-size:clamp(34px,3.8vw,64px)}
.tile small{color:var(--tx);opacity:.7;font-size:clamp(16px,1.3vw,24px)}
.tile:focus{transform:scale(1.05) translateY(-4px);border-color:var(--hi);box-shadow:0 18px 44px rgba(0,0,0,.6);z-index:3}
.sh{display:flex;align-items:center;gap:16px;margin-top:2.6vh}
.sh h3{font-size:clamp(24px,2.2vw,36px);color:var(--gold);font-weight:700;margin-inline-end:14px}
.circ{width:clamp(48px,4vw,64px);height:clamp(48px,4vw,64px);flex:none;border-radius:50%;background:var(--sf);border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,1.8vw,28px);cursor:pointer;transition:transform .15s;padding:0}
.circ:focus{transform:scale(1.15)}
.sug{flex:1;display:flex;gap:2vw;min-height:0;padding:12px 6px 4px}
.hero{flex:1;min-width:0;position:relative;border-radius:28px;overflow:hidden;display:flex;border:2px solid transparent;cursor:pointer;background:linear-gradient(135deg,#2a2a2d,#0a0a0a);transition:transform .18s,box-shadow .18s}
.hero .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(22px) brightness(.5)}
.hero .fg{position:relative;z-index:1;flex:none;height:100%;max-width:52%;aspect-ratio:2/3;object-fit:cover}
.hero .fg.lv{aspect-ratio:auto;width:42%;object-fit:contain;padding:7%}
.hero .fg.nf{display:flex;align-items:center;justify-content:center;font-size:72px;background:rgba(255,255,255,.05)}
.hero .inf{position:relative;z-index:1;flex:1;min-width:0;padding:22px 26px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero .lab{color:var(--gold);font-weight:700;font-size:clamp(17px,1.4vw,24px)}
.hero .ttl{font-size:clamp(22px,2.2vw,40px);font-weight:900;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .pl{align-self:flex-start;margin-top:12px;background:var(--hi);color:#000;padding:8px 24px;border-radius:999px;font-weight:900;font-size:clamp(17px,1.4vw,24px);text-shadow:none}
.hero.empty{cursor:default;opacity:.6}.hero.empty .inf{justify-content:center}
.hero:focus{transform:scale(1.03) translateY(-6px);border-color:var(--hi);box-shadow:0 24px 56px rgba(0,0,0,.65);z-index:3}
.fvb{position:absolute;top:8px;inset-inline-end:10px;z-index:4;color:#fff;font-size:26px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#fv,#cc{position:fixed;top:30px;z-index:30;display:none;color:#fff;font-size:30px;background:rgba(0,0,0,.7)}#fv{inset-inline-end:40px}#cc{inset-inline-end:116px}#fv.on svg{fill:#fff}.fvb{font-size:22px}
.pill{background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:8px 26px;cursor:pointer;backdrop-filter:blur(8px)}
/* صفحة القسم */
#page{height:100%;overflow-y:auto;padding:30px 5vw 50px;position:relative;z-index:2}#page::-webkit-scrollbar{width:0}
.ph{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.ph h2{font-size:clamp(40px,4.6vw,72px);flex:1;line-height:1.2}.ph h2 small{font-family:Cairo,sans-serif;font-size:22px;color:var(--mu);margin-inline-start:12px}
.ph input{width:min(380px,40vw);margin:0;border-radius:999px}
.cont h3{font-size:25px;color:var(--gold);margin:6px 0 12px}
.crow{display:flex;gap:18px;padding:22px 8px 26px;overflow-x:auto}.crow::-webkit-scrollbar{height:0}
.crow .cd{flex:none;width:clamp(170px,12vw,240px);aspect-ratio:2/3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(170px,12vw,240px),1fr));gap:24px;padding:14px 8px}
.grid .cd{flex:none;aspect-ratio:2/3}
.grid.lvg{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.grid.lvg .cd{aspect-ratio:16/10}
.cd.more{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);background:var(--pn)}
.pb{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(255,255,255,.2);z-index:3}.pb i{display:block;height:100%;background:var(--hi)}
.cd .cap.hp{bottom:7px}
/* المشغّل */
#sp{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:3vh 3vw}
#sp.on{display:flex}
.spc{width:min(1000px,96vw);max-height:92vh;overflow-y:auto;background:var(--cd);border:1px solid var(--ln);border-radius:30px;padding:clamp(18px,3vh,36px) clamp(18px,3vw,44px)}.spc::-webkit-scrollbar{width:0}
.sph{display:flex;align-items:center;gap:14px;margin-bottom:clamp(10px,2vh,20px)}.sph h2{flex:1;font-size:clamp(30px,5vh,52px)}
.spr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:clamp(8px,1.6vh,16px) 0}
.spr input{flex:1;min-width:200px;margin:0;font-size:clamp(18px,2.8vh,26px);border-radius:999px;padding:10px 24px}
.spr .btn{width:auto;padding:10px 34px;border-radius:999px;color:#000;font-size:clamp(18px,2.8vh,26px)}
.spr .pill{font-size:clamp(17px,2.6vh,24px)}.pill.on{background:var(--hi);color:var(--ov);font-weight:700}
#sp-cfg{display:none;flex-direction:column;gap:10px;margin-bottom:10px}#sp-cfg.on{display:flex}#sp-cfg input{margin:0;font-size:clamp(17px,2.6vh,24px)}#sp-cfg .btn{color:#000}
#sp-st{color:var(--mu);min-height:30px;font-size:clamp(16px,2.4vh,22px)}
#sp-list{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.ri{display:flex;justify-content:space-between;gap:16px;padding:12px 20px;border:2px solid var(--ln);border-radius:16px;cursor:pointer;background:var(--ip);font-size:clamp(16px,2.4vh,22px)}.ri small{color:var(--mu);white-space:nowrap}
.ri:focus{border-color:var(--hi);box-shadow:0 0 0 3px rgba(128,128,128,.4)}
#sp-o{min-width:70px;text-align:center}.sl{color:var(--mu);margin-inline-end:6px}
.circ.sx:focus,.pill.sx:focus,#sp input:focus,#sp .btn:focus{border-color:var(--hi)!important;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
video::cue{font:700 clamp(22px,2.4vw,44px) Cairo,Tahoma,Arial,sans-serif;background:rgba(0,0,0,.7);color:#fff}

#app{position:fixed;inset:0;z-index:5;background:#000}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);text-align:center;padding:20px;font-size:28px}
#osd{position:fixed;inset-inline-start:40px;bottom:40px;background:rgba(0,0,0,.82);border-inline-start:6px solid var(--gold);padding:12px 24px;border-radius:12px;z-index:30;display:none;font-size:28px;font-weight:700}
html.tv *{backdrop-filter:none!important}
@media(max-width:900px){html,body{overflow:auto;height:auto}#home{height:auto;min-height:100vh;padding:24px 18px}header{flex-direction:column}.nav{flex-direction:column;height:auto}.tile{min-height:100px}.sug{flex-direction:column}.hero{flex:none;height:300px}#page{height:auto;overflow:visible}.tw{min-width:0;width:100%}.card0{padding:24px 20px}}

html[data-th=light]{--bg:#f3f3f5;--b2:#fff;--pn:#fff;--ln:#d2d2d7;--tx:#111;--mu:#66666b;--gold:#111;--hi:#111;--mar:#111;--cd:rgba(255,255,255,.94);--ip:#fff;--ov:#fff;--sf:rgba(255,255,255,.85)}
html[data-th=light] #scene{filter:invert(1) blur(2px)}html[data-th=light] .logo{filter:invert(1)}
html[data-th=light] .tile{background:linear-gradient(135deg,#e6e6ea,#fff)!important}
#ac{font-size:19px;color:var(--tx)}
.sug{justify-content:center;align-items:stretch}
.hero{flex:none;aspect-ratio:2/3;height:100%;max-height:100%;background:var(--pn)}.hero.lvc{aspect-ratio:16/10}
.hero img.pz{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero img.pz.lg2{object-fit:contain;padding:14%}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}.hero video.on,#p-pv video.on{opacity:1}
.hero .ck{position:absolute;top:12px;inset-inline-start:12px;z-index:3;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25)}
.nf2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;color:var(--mu)}
body[data-v=page] #page{display:flex;flex-direction:column;overflow:hidden}
.pg{flex:1;min-height:0;display:grid;grid-template-columns:20% 1fr 30%;gap:20px}
.pg>div{min-height:0;overflow-y:auto;border:1px solid var(--ln);border-radius:22px;background:var(--sf);padding:8px}.pg>div::-webkit-scrollbar{width:0}
.pg.ng{grid-template-columns:1fr 30%}.pg.ng #p-g{display:none}
.gi,.li{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px;border:2px solid transparent;border-radius:14px;cursor:pointer;font-size:21px;line-height:1.3}
.gi.on{background:rgba(128,128,128,.2);font-weight:700}.gi:focus,.li:focus{border-color:var(--hi);background:rgba(128,128,128,.22)}
.li img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:rgba(128,128,128,.15);flex:none}
.li span:not(.fvb){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .fvb{position:static;font-size:22px}
#p-pv{position:relative;overflow:hidden;padding:0;aspect-ratio:1;align-self:start}
#p-pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
@media(max-width:900px){body[data-v=page] #page{display:block;overflow:visible}.pg{display:block}.pg>div{max-height:46vh;margin-bottom:14px}#p-pv{display:none}}
</style>
</head>

const xapi=(a,x='')=>`${S.conf.server}/player_api.php?username=${enc(S.conf.user)}&password=${enc(S.conf.pass)}&action=${a}${x}`;
function nameOf(l){let q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c=='"')q=!q;else if(c==','&&!q)return l.slice(i+1).trim()}return''}
function parseM3U(x){
 const out=[];let m=null;
 x.split(/\r?\n/).forEach(l=>{l=l.trim();
  if(l.startsWith('#EXTINF')){const g=k=>(l.match(new RegExp(k+'="([^"]*)"'))||[])[1]||'';
   m={name:nameOf(l)||g('tvg-name')||t('ch'),logo:g('tvg-logo'),group:g('group-title')||t('ungr')}}
  else if(l&&!l.startsWith('#')&&m){m.url=l;m.id='m'+out.length+'_'+m.name;out.push(m);m=null}
 });
 S.chans=out;
}
function classify(){S.live=S.chans.filter(c=>!MV.test(c.group)&&!SR.test(c.group));S.mv=S.chans.filter(c=>MV.test(c.group)&&!SR.test(c.group));S.sr=S.chans.filter(c=>SR.test(c.group))}
async function jget(u){let r;try{r=await fetch(u)}catch(e){if(!(window.HalaNative&&HalaNative.http))throw e;const x=await xhttp('GET',u,{});if(!x.status)throw e;return {ok:x.status<400,status:x.status,json:async()=>JSON.parse(x.body)}}return r}
async function check(c){
 let r;try{r=await jget(`${c.server}/player_api.php?username=${enc(c.user)}&password=${enc(c.pass)}`)}catch(e){throw new Error(t('srvdown'))}
 if(!r.ok)throw new Error(r.status==401||r.status==403?t('badlogin'):t('http',r.status));
 let j;try{j=await r.json()}catch(e){throw new Error(t('badlogin'))}
 const u=j&&j.user_info;if(!u||u.auth==0)throw new Error(t('badlogin'));
 const st=String(u.status||'').toLowerCase(),ex=+u.exp_date,dd=ex?new Date(ex*1000):null,ds=dd?dd.toLocaleDateString(S.lang=='ar'?'ar-JO-u-nu-latn':'en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
 if(st=='expired'||(dd&&dd<new Date()))throw new Error(t('expd',ds));
 if(st&&st!='active')throw new Error(t('banned'));
 S.acc=t('accok',ds,dd?Math.ceil((dd-new Date())/864e5):0)+(u.max_connections?` · ${u.active_cons||0}/${u.max_connections}`:'');
}
async function load(conf){
 S.acc='';
 const m=conf.mode=='m3u'&&(conf.url||'').match(/^(https?:\/\/[^\/?#]+)\/(?:get|player_api)\.php\?(.*)$/i);
 if(m){const q=new URLSearchParams(m[2]);if(q.get('username')&&q.get('password'))conf={mode:'xt',server:m[1],user:q.get('username'),pass:q.get('password')}}
 S.conf=conf;S.mv=[];S.sr=[];
 if(conf.mode=='m3u'){
  if(!conf.url)throw new Error(t('needurl'));
  const r=await fetch(conf.url);if(!r.ok)throw new Error(t('err')+r.status);
  parseM3U(await r.text());classify();
 }else{
  if(!conf.server||!conf.user||!conf.pass)throw new Error(t('fill'));
  await check(conf);
  const g=async a=>{const r=await jget(xapi(a));if(!r.ok)throw new Error(t('deny'));return r.json()};
  const [c,st]=await Promise.all([g('get_live_categories'),g('get_live_streams')]);
  if(!Array.isArray(st))throw new Error(t('badacc'));
  const cm={};(c||[]).forEach(x=>cm[x.category_id]=x.category_name);
  S.chans=st.map(x=>({id:'x'+x.stream_id,name:x.name,logo:x.stream_icon,group:cm[x.category_id]||t('ungr'),url:`${conf.server}/live/${enc(conf.user)}/${enc(conf.pass)}/${x.stream_id}.m3u8`}));
  S.live=S.chans;
  const cat=a=>g(a).then(l=>{const o={};(Array.isArray(l)?l:[]).forEach(x=>o[x.category_id]=x.category_name);return o}).catch(()=>({}));
  Promise.all([g('get_vod_streams'),g('get_series'),cat('get_vod_categories'),cat('get_series_categories')]).then(([v,s2,vc,sc])=>{
   if(Array.isArray(v))S.mv=v.map(x=>({id:'v'+x.stream_id,name:x.name,logo:x.stream_icon,group:vc[x.category_id]||t('ungr'),url:`${conf.server}/movie/${enc(conf.user)}/${enc(conf.pass)}/${x.stream_id}.${x.container_extension||'mp4'}`}));
   if(Array.isArray(s2))S.sr=s2.map(x=>({id:'s'+x.series_id,name:x.name,logo:x.cover,group:sc[x.category_id]||t('ungr'),sid:x.series_id}));
   if(V()=='home')renderSug();else if(V()=='page')renderPage();
  }).catch(()=>{});
 }
 if(!S.chans.length)throw new Error(t('nochan'));
 return conf;
}

  p+=46+nl+xl+cl;
  if(/\.srt$/i.test(nm)){const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),d=b.subarray(st,st+cs);
   return mt==0?d:new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}}
 throw 0;
}
async function webGet(id){
 spSt(t('subdl'));
 try{
  const r=await fetch(`${WB}/en/subtitleserve/sub/${id}`);if(!r.ok)throw 0;
  const u=await unzip(new Uint8Array(await r.arrayBuffer()));
  let x;try{x=new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){x=new TextDecoder(OS.lang=='ar'?'windows-1256':'windows-1252').decode(u)}
  S.sub={srt:x,lang:OS.lang,off:0};applySub();spSt(t('subok'));$('#sp-o').textContent='0.0s';return true;
 }catch(e){spSt(t('subfail')+'opensubtitles.org');return false}
}
async function subFind(q,tr){
 let a=[],we=0;try{a=await webFind(q,tr)}catch(e){we=1}
 if(!a.length&&osOK()){const b=await osFind(q,tr);if(b)a=b.map(at=>({name:at.release||at.files[0].file_name||'—',n:at.download_count||0,get:()=>osGet(at.files[0].file_id)}))}
 if(!a.length&&we&&!$('#sp-st').textContent)spSt(t('subnet'));
 return a;
}
async function osSearch(){
 const q=$('#sp-q').value.trim();if(!q)return;S.spq=q;spSt(t('subsearching'));$('#sp-list').innerHTML='';
 const a=await subFind(q,q==cleanTitle(S.track&&S.track.name)?S.track:null);
 if(!a.length){if($('#sp-st').textContent==t('subsearching'))spSt(t('subnone'));return}spSt('');
 a.forEach(x=>{const d=document.createElement('div');d.className='ri sx';d.tabIndex=0;d.dir='auto';const l=document.createElement('span'),m=document.createElement('small');l.textContent=x.name;m.textContent=x.n?'⬇ '+x.n:'';d.append(l,m);d.onclick=()=>x.get();$('#sp-list').append(d)});
 focusEl($('#sp-list .ri'));

async function autoSub(){
 const tr=S.track;if(!tr)return;spSt('');
 const a=await subFind(cleanTitle(tr.name),tr);if(S.track!==tr)return;
 if(!a.length){osd($('#sp-st').textContent||t('subnone'));return}

async function osGet(fid){
 spSt(t('subdl'));
 if(!(await osLogin()))return;
 let r=await xhttp('POST',OS.base+'/download',osH(true),JSON.stringify({file_id:fid,sub_format:'srt'})),j=jp(r.body);
 if(r.status==401){OS.tok=null;if(await osLogin())r=await xhttp('POST',OS.base+'/download',osH(true),JSON.stringify({file_id:fid,sub_format:'srt'})),j=jp(r.body)}
 if(r.status==406){spSt(t('sublimit'));return}
 if(!j.link){spSt(t('subfail')+(j.message||r.status));return}
 const f=await xhttp('GET',j.link,{});
 if(f.status!=200||!f.body){spSt(t('subnet'));return}
 S.sub={srt:f.body,lang:OS.lang,off:0};applySub();spSt(t('subok'));$('#sp-o').textContent='0.0s';
}
function srt2vtt(x,off){
 const fm=v=>{v=Math.max(0,Math.round(v*1000));const h=v/36e5|0,m=(v%36e5)/6e4|0,s=(v%6e4)/1e3|0,ms=v%1e3,p=(n,l=2)=>String(n).padStart(l,'0');return `${p(h)}:${p(m)}:${p(s)}.${p(ms,3)}`};
 const tm=(h,m,s,ms)=>+h*3600+ +m*60+ +s+ +ms.padEnd(3,'0')/1000+off;
 return 'WEBVTT\n\n'+x.replace(/^\uFEFF/,'').replace(/\r/g,'').replace(/\{\\an?\d\}/g,'')
  .replace(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/g,(_,a,b,c,d,e,f,g,h)=>fm(tm(a,b,c,d))+' --> '+fm(tm(e,f,g,h)));
}
function clearSub(){const v=$('#v');$$('#v track').forEach(x=>{if(x.src.startsWith('blob:'))URL.revokeObjectURL(x.src);x.remove()})}
function applySub(){
 clearSub();if(!S.sub)return;const v=$('#v');
 const tr=document.createElement('track');tr.kind='subtitles';tr.label='Subtitles';tr.srclang=S.sub.lang;tr.default=true;
 tr.src=URL.createObjectURL(new Blob([srt2vtt(S.sub.srt,S.sub.off)],{type:'text/vtt'}));
 v.append(tr);const on=()=>{for(const x of v.textTracks)x.mode=x.mode=='disabled'||x.mode=='hidden'?'showing':x.mode;tr.track.mode='showing'};
 tr.addEventListener('load',on);on();
}
function subOff(d){if(!S.sub)return;S.sub.off=Math.round((S.sub.off+d)*10)/10;$('#sp-o').textContent=S.sub.off.toFixed(1)+'s';applySub()}

function focusEl(e){if(e){e.focus();e.scrollIntoView({block:'nearest',inline:'nearest'})}}
function spatial(k,sel){
 const a=document.activeElement,els=$$(sel).filter(e=>e.getClientRects().length);if(!els.includes(a)){focusEl(els[0]);return}
 const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 els.forEach(e=>{if(e===a)return;const q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
  if(!(k==37?dx<-5:k==39?dx>5:k==38?dy<-5:dy>5))return;
  const s=(k==37||k==39)?Math.abs(dx)+Math.abs(dy)*2.5:Math.abs(dy)+Math.abs(dx)*2.5;if(s<bs){bs=s;best=e}});
 if(best)focusEl(best);
}
const BACK=[27,8,10009,461,4,166];
document.addEventListener('keydown',e=>{
 const k=e.keyCode,a=document.activeElement,typing=a&&a.tagName=='INPUT',v=V();
 if(v=='login'){
  const f=$$('#login .lg,#login .tab,#login input,#login .btn').filter(x=>x.offsetParent),i=f.indexOf(a);
  if(k==40||(k==L&&!typing)){e.preventDefault();focusEl(f[Math.min(i+1,f.length-1)])}
  else if(k==38||(k==R&&!typing)){e.preventDefault();focusEl(f[Math.max(i-1,0)])}
  else if(k==13&&typing){e.preventDefault();$('#go').click()}
  else if(k==13&&a&&a.click){e.preventDefault();a.click()}
  return;
 }
 if(v=='home'||v=='page'){
  const sel=v=='home'?'#home .hero:not(.empty),#home .tile,#home .circ':'#page .gi,#page .li,#page .pill,#page input';
  if(BACK.includes(k)&&!typing){e.preventDefault();if(v=='page')showHome();return}
  if(typing&&(k==37||k==39))return;
  if((k==405||k==70)&&!typing&&a&&a._it){e.preventDefault();toggleFavEl(a);return}
  if(k>=37&&k<=40){e.preventDefault();spatial(k,sel)}else if(k==13&&a&&a.click&&!typing){e.preventDefault();a.click()}
  return;
 }
 const vd=$('#v');
 if(spOpen()){
  const ty=a&&a.tagName=='INPUT';
  if(BACK.includes(k)&&!(ty&&k==8)){e.preventDefault();closeSubs();return}
  if(ty&&(k==37||k==39))return;
  if(ty&&k==13){e.preventDefault();a.id=='sp-q'?osSearch():$('#sp-save').click();return}
  if(k>=37&&k<=40){e.preventDefault();spatial(k,'#sp .sx')}else if(k==13&&a&&a.click&&!ty){e.preventDefault();a.click()}
  return;
 }
 if(k==405||k==70||k==48){e.preventDefault();favNow()}
 else if(S.vod&&(k==406||k==67||k==40||k==82||k==77)){e.preventDefault();openSubs()}
 else if(S.vod&&k==38){e.preventDefault();favNow()}
 else if(S.vod&&k==R){e.preventDefault();vd.currentTime-=30}
 else if(BACK.includes(k)||k==R){e.preventDefault();exitPlayer()}
 else if(k==38||k==427||k==33){e.preventDefault();S.vod?vd.currentTime+=30:step(-1)}
 else if(k==40||k==428||k==34){e.preventDefault();S.vod?vd.currentTime-=30:step(1)}
 else if(k==L&&S.vod){e.preventDefault();vd.currentTime+=30}
 else if(k==13||k==415||k==179||k==85){e.preventDefault();vd.paused?vd.play():vd.pause()}
 else if(k==417)vd.currentTime+=30;else if(k==412)vd.currentTime-=30;
});
try{if(window.tizen&&tizen.tvinputdevice){['MediaPlayPause','MediaRewind','MediaFastForward','ChannelUp','ChannelDown'].forEach(n=>{try{tizen.tvinputdevice.registerKey(n)}catch(e){}})}}catch(e){}
