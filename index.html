<style>

#home{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#home::-webkit-scrollbar{display:none}#home>*{flex-shrink:0}
.rch{display:flex;align-items:center;gap:16px;margin-top:2.4vh}.rch h3{font-size:clamp(24px,2.2vw,36px);color:var(--gold);font-weight:700;margin-inline-end:14px}

header>div:first-child{display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0}
#hi{font-size:clamp(44px,4.8vw,80px)}
#sub{font-size:clamp(18px,1.5vw,26px);margin:6px 0 18px}
#hq{width:min(560px,100%);margin:0}
.tw{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;min-width:min(44vw,820px);padding:0;background:none;border:0;border-radius:0;align-content:center}
#clk{font-size:clamp(40px,3.4vw,60px)}
#dt{align-self:center;font-size:clamp(17px,1.4vw,24px)}
#ac{display:contents}
#wx,#nt,#ac>div{grid-column:1/-1;margin:0;font-size:clamp(17px,1.3vw,23px);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nt{color:var(--mu)}
#ac>div:first-child::before{content:"🔑 "}#ac>div:last-child::before{content:"📺 "}
.nav{height:17vh;min-height:96px;margin-top:2vh}
.sug{flex:none;height:32vh}
#wg{flex:none}
/* القوائم من جوا */
#page{padding:34px 4vw 36px}
.ph{gap:16px;margin-bottom:22px}
.ph h2{font-size:clamp(36px,3.6vw,60px)}
.ph .pill{padding:10px 30px;font-size:clamp(18px,1.5vw,26px)}
.pill:focus,.circ:focus{background:var(--hi);color:var(--ov);transform:scale(1.06)}
.pg{grid-template-columns:var(--cg,19%) 7% 1fr 31%;gap:24px}
.pg.gvw{grid-template-columns:var(--cg,19%) 7% 1fr}
.pg>div{background:rgba(128,128,128,.10);border:0;border-radius:28px;padding:14px}
.gi{min-height:64px;padding:10px 20px;font-size:clamp(20px,1.7vw,30px);border-radius:18px}
.gi+.gi,.li+.li{margin-top:6px}
.li{padding:8px 18px;border-radius:20px;font-size:clamp(20px,1.8vw,30px)}
#p-l:not(.gv) .li{height:clamp(84px,calc((100vh - 270px)/6),132px)}
.ai{padding:8px 0;border-radius:14px}
.gi.on:not(:focus),.ai.on:not(:focus){background:rgba(128,128,128,.30)}
.gi:focus,.li:focus,.ai:focus{background:var(--hi);color:var(--ov);border-color:transparent;transform:scale(1.03);z-index:2}
.gv .li:focus{background:transparent;color:#fff;box-shadow:0 0 0 4px var(--hi),0 14px 30px rgba(0,0,0,.5);transform:scale(1.04)}
/* الإعدادات: شبكة */
body[data-v=set] #set{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:min-content;align-content:start;gap:20px 24px;padding:36px 5vw 60px}
#set>.ph,#set .sh3,#set>.sub,#set>p{grid-column:1/-1}
#set .sh3{margin:18px 0 0;padding-bottom:8px;border-bottom:1px solid var(--ln);font-size:clamp(22px,1.8vw,32px)}
#set .btn{width:100%!important;min-height:clamp(84px,10vh,120px);display:flex;align-items:center;padding:18px 26px;border-radius:24px;background:rgba(128,128,128,.14);border:0;font-size:clamp(20px,1.6vw,28px)}
#set .btn:focus{background:var(--hi);color:var(--ov);transform:scale(1.05);box-shadow:0 8px 20px rgba(0,0,0,.45);z-index:2}
#set input{width:100%}
#st-ver{color:var(--mu);font-size:clamp(17px,1.3vw,22px);direction:ltr}

/* ===== تعديلات الرئيسية (2) ===== */
#hi{font-size:clamp(40px,4vw,68px)}
#sub{margin:4px 0 14px}
.tw{min-width:min(30vw,560px);gap:3px 18px}
#clk{font-size:clamp(28px,2.3vw,42px)}
#dt{font-size:clamp(14px,1.05vw,18px)}
#wx,#nt,#ac>div{font-size:clamp(14px,1.05vw,18px)}
.nav{height:12vh;min-height:76px;margin-top:1.6vh;width:min(1100px,100%);margin-inline:auto;gap:1.4vw}
.tile{background:rgba(128,128,128,.13)!important;border:1px solid rgba(255,255,255,.07);border-radius:20px}
.tile .bgi{opacity:.07}
.tile .ic{font-size:clamp(30px,3vw,52px)}
.tile .ruq{font-size:clamp(24px,2.4vw,40px)}
.tile small{font-size:clamp(14px,1vw,18px)}
.tile .lb{gap:1.2vw;padding:0 1.6vw}
.sug{height:41vh}
.sh{margin-top:3vh}

/* ===== سرعة القوائم ===== */
#p-l:not(.gv) .li{content-visibility:auto;contain-intrinsic-size:auto 110px}

/* ===== ميزات جديدة ===== */
.sug{height:39vh}
#cw{margin-inline-start:auto;display:flex;gap:14px}
.cwc{position:relative;display:flex;align-items:center;gap:12px;width:clamp(260px,19vw,360px);height:clamp(64px,8vh,88px);padding:6px 12px 10px;border-radius:18px;background:rgba(128,128,128,.14);border:2px solid transparent;overflow:hidden;cursor:pointer;transition:transform .12s}
.cwc img{height:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;flex:none}
.cwt{min-width:0;display:flex;flex-direction:column}
.cwt b{font-size:clamp(15px,1.15vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwt small{color:var(--mu);font-size:clamp(12px,.9vw,15px)}
.cwc>i{position:absolute;left:0;bottom:0;height:4px;background:var(--hi)}
.cwc:focus{background:var(--hi);color:var(--ov);transform:scale(1.05)}.cwc:focus small{color:var(--ov)}
#ld{position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;background:#05060a;opacity:1;transition:opacity .45s ease;pointer-events:none;overflow:hidden;text-align:center}
#ld.on{display:flex}#ld.out{opacity:0}
/* NOTE: 'inset' shorthand is unsupported on older Android TV WebViews (<87) -> layer collapsed to 0x0 so art was tiny and animation never rendered. Explicit offsets used instead. */
#ld img.ldb{display:block;position:absolute;top:-2vh;left:-2vw;width:20vw;height:19vh;object-fit:cover;-webkit-filter:blur(7px) saturate(1.4);filter:blur(7px) saturate(1.4);-webkit-transform:scale(5.4);transform:scale(5.4);-webkit-transform-origin:0 0;transform-origin:0 0;opacity:0;transition:opacity .6s ease}
#ld img.ldb.ld-on{opacity:.5}
#ld.pc{align-items:flex-start;text-align:start}
html[dir=rtl] #ld.pc{padding-right:36vw;padding-left:6vw}html[dir=ltr] #ld.pc{padding-left:36vw;padding-right:6vw}
#ld.pc img.ldp{z-index:3;top:50%;bottom:auto;width:37.3vh;height:56vh;margin-top:-28vh;border-radius:16px;object-fit:cover;box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.14)}
html[dir=rtl] #ld.pc img.ldp{right:7vw;left:auto}html[dir=ltr] #ld.pc img.ldp{left:7vw;right:auto}
#ld.pc .ldo{background:rgba(0,0,0,.18)}
#ld.pc .ldt,#ld.pc .lds{text-align:start;max-width:none;padding:0;z-index:4}#ld.pc .ldt{font-size:clamp(30px,7.4vh,86px)}#ld.pc img.ldl{max-width:50vw;z-index:4}
#ld .ldt{display:block;max-height:40vh;overflow:hidden;font-weight:900;letter-spacing:.01em;text-shadow:0 0 34px rgba(255,205,90,.28),0 4px 28px rgba(0,0,0,.92)}
#ld.on:not(.out) .ldt.ld-pulse{-webkit-animation:hbeat 1.9s ease-in-out infinite;animation:hbeat 1.9s ease-in-out infinite}
html[dir=rtl] #ld.pc .ldt.ld-pulse,html[dir=rtl] #ld.pc img.ldl{-webkit-transform-origin:100% 50%;transform-origin:100% 50%}html[dir=ltr] #ld.pc .ldt.ld-pulse,html[dir=ltr] #ld.pc img.ldl{-webkit-transform-origin:0 50%;transform-origin:0 50%}
#ld img.ldp{position:absolute;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;object-fit:cover;object-position:50% 50%;opacity:0;transition:opacity .5s ease;-webkit-transform:translateZ(0);transform:translateZ(0)}
#ld img.ld-on{opacity:1}
#ld .ldo{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.28)}
#ld .ldt{position:relative;max-width:78vw;padding:0 4vw;font-weight:900;font-size:clamp(34px,8vh,96px);line-height:1.2;color:#fff;text-shadow:0 4px 28px rgba(0,0,0,.9)}
#ld img.ldl{position:relative;max-width:56vw;max-height:28vh;object-fit:contain;opacity:0;transition:opacity .5s ease;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
#ld img.ldl.ld-on{opacity:1}
#ld.on:not(.out) img.ldl.ld-on,#ld.on:not(.out) img.ldp.ld-on.hb{-webkit-animation:hbeat 1.9s ease-in-out infinite;animation:hbeat 1.9s ease-in-out infinite}
#ld img.ldp.hb{-webkit-animation-name:hbeatp;animation-name:hbeatp}
#ld .lds{position:relative;margin-top:2.2vh;font-size:clamp(16px,3vh,30px);color:rgba(255,255,255,.75);font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.9)}
@-webkit-keyframes hbeat{0%,16%,34%,100%{-webkit-transform:translateZ(0) scale(1)}8%{-webkit-transform:translateZ(0) scale(1.09)}26%{-webkit-transform:translateZ(0) scale(1.05)}}
@keyframes hbeat{0%,16%,34%,100%{transform:translateZ(0) scale(1)}8%{transform:translateZ(0) scale(1.09)}26%{transform:translateZ(0) scale(1.05)}}
@-webkit-keyframes hbeatp{0%,16%,34%,100%{-webkit-transform:translateZ(0) scale(1)}8%{-webkit-transform:translateZ(0) scale(1.03)}26%{-webkit-transform:translateZ(0) scale(1.018)}}
@keyframes hbeatp{0%,16%,34%,100%{transform:translateZ(0) scale(1)}8%{transform:translateZ(0) scale(1.03)}26%{transform:translateZ(0) scale(1.018)}}
#bf{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:bfs .9s linear infinite;display:none;z-index:7;pointer-events:none}@keyframes bfs{to{transform:rotate(360deg)}}
#st-logt{display:none;grid-column:1/-1;white-space:pre-wrap;direction:ltr;text-align:left;font-size:15px;color:var(--mu);max-height:30vh;overflow:hidden}#st-logt.on{display:block}
#upb{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:90;background:var(--hi);color:var(--ov);padding:10px 26px;border-radius:999px;font-weight:700;font-size:clamp(16px,1.4vw,24px);display:none}

/* --- شريط الحروف أنحف + ترك مساحة أكبر للعناوين --- */
.pg{grid-template-columns:var(--cg,19%) 4.6% 1fr 30%}
#p-a{grid-template-columns:1fr;gap:2px;padding:6px 3px}
.ai{padding:3px 0;font-size:clamp(13px,1.15vw,19px);border-radius:9px}
/* --- شاشة الافتتاح (سينمائية خفيفة: transform/opacity فقط، بدون blur) --- */
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .vg{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 38%,rgba(0,0,0,.85) 100%)}
#splash .gl{position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.5) 0%,rgba(255,200,110,.2) 32%,rgba(0,0,0,0) 68%);opacity:0;animation:glow 2.6s ease-out forwards}
#splash .ln{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(255,236,190,.95),transparent);transform:scaleX(0);animation:ln 1.3s .1s ease-out forwards}
#splash .lw{position:relative;opacity:0;transform:scale(1.14);animation:lg 1.3s .35s cubic-bezier(.2,.7,.2,1) forwards}
#splash .lw img{display:block;height:clamp(150px,30vmin,324px);width:auto}
#splash .sw{position:absolute;top:0;right:0;bottom:0;left:0;-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 140% 0/250% 100% no-repeat;animation:sw 1.1s 1.2s ease-in-out forwards}
@keyframes glow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.7;transform:scale(1.1)}}
@keyframes ln{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes lg{to{opacity:1;transform:scale(1)}}
@keyframes sw{to{background-position:-40% 0}}

/* ترجمة: تمييز الخيار اللي واقف عليه الريموت + الخيار المختار */
#sp .btn,#sp .pill,#sp .circ,#sp .ri{background:rgba(255,255,255,.07);color:var(--tx);border:2px solid var(--ln);font-weight:700;transition:transform .12s,background-color .12s,box-shadow .12s}
#sp .pill.on,#sp .ri.cur{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
#sp .ri.cur::after{content:'\2713';margin-inline-start:12px;font-weight:900}
#sp .btn:focus,#sp .pill:focus,#sp .circ:focus,#sp .ri:focus,#sp input:focus{background:rgba(255,255,255,.34)!important;color:var(--tx)!important;border-color:#fff!important;box-shadow:0 0 0 4px rgba(255,255,255,.6)!important;transform:scale(1.04);position:relative;z-index:2}
#sp .circ svg{stroke:currentColor;fill:none}
/* ExoPlayer: الواجهة شفافة فوق الفيديو الأصلي */
html.exo-on,html.exo-on body,html.exo-on #app,html.exo-on video#v{background:transparent!important}
#xb{position:fixed;left:6vw;right:6vw;top:max(116px,11vh);display:none;flex-direction:column;align-items:center;gap:12px;direction:ltr;z-index:32;pointer-events:none;font-weight:800}
#xb.on{display:flex}
#xb-r{display:flex;align-items:center;gap:22px;width:100%;padding:18px 30px;border-radius:22px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 40px rgba(0,0,0,.6);font-size:clamp(28px,3.1vh,40px);font-variant-numeric:tabular-nums}
#xb-t,#xb-d{flex:none;min-width:3.6em;text-align:center}#xb-d{color:#cfcfd4}
#xb-b{position:relative;flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.28)}
#xb-f{display:block;height:100%;width:0;border-radius:7px;background:#fff}
#xb-k{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 0 18px rgba(0,0,0,.8)}
#xb.nd #xb-b{display:none}#xb.nd #xb-d{flex:1;text-align:start;color:#fff}
#xb-j{display:none;padding:8px 30px;border-radius:999px;background:#fff;color:#000;font-size:clamp(28px,3.2vh,42px);font-weight:900}#xb-j.on{display:block}
/* ===== playback HUD: clean translucent card, slim bar, engine badge ===== */
#xb-r{background:rgba(24,24,28,.84);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:16px 34px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
#xb-b{height:10px;border-radius:5px;background:rgba(255,255,255,.22)}#xb-f{border-radius:5px}
#xb-k{width:26px;height:26px;margin:-13px 0 0 -13px;box-shadow:0 2px 10px rgba(0,0,0,.6)}
#xb-e{display:none;padding:4px 18px;border-radius:999px;background:rgba(24,24,28,.78);font-size:clamp(15px,2.1vh,22px);color:rgba(255,255,255,.78);letter-spacing:.02em}
#xb.on #xb-e:not(:empty){display:block}
/* ===== HUD v3: compact bottom bar ===== */
#xb{top:auto!important;bottom:max(22px,3.5vh);left:50%!important;right:auto!important;width:min(980px,66vw);transform:translateX(-50%);gap:8px}
#xb-j{order:-1;font-size:clamp(17px,2.3vh,26px);padding:5px 20px}
#xb-r{flex-wrap:wrap;row-gap:6px;gap:14px;padding:10px 24px 12px;border-radius:20px;font-size:clamp(17px,2.2vh,25px)}
#xb-t,#xb-d{min-width:3.2em}
#xb-b{height:6px!important}#xb-k{width:18px!important;height:18px!important;margin:-9px 0 0 -9px!important}
#xb-c{flex:0 0 100%;display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);direction:ltr}
#xb-c b{display:flex;align-items:center;justify-content:center;gap:6px;min-width:clamp(62px,5.5vw,90px);height:clamp(34px,4.2vh,48px);padding:0 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:clamp(14px,1.9vh,21px);font-weight:800;pointer-events:auto;cursor:pointer;transition:transform .12s,background-color .12s}
#xb-c b i{font-style:normal}
#xb-c b svg{width:clamp(17px,2.3vh,26px);height:clamp(17px,2.3vh,26px);fill:#fff;display:block}
#xb-c b.hit{background:#fff;color:#000;transform:scale(1.1)}
#xb-c b.hit svg{fill:#000}
#xb-pp{min-width:clamp(70px,6.3vw,100px)!important}
#xb.live #xb-rw,#xb.live #xb-ff{display:none}
#xb-e{font-size:clamp(12px,1.6vh,17px)!important;padding:2px 12px!important}
html.xbon #subov{bottom:max(190px,22vh)}
html.xbon #osd,html.xbon #pm{bottom:max(190px,22vh)}
/* ===== rich option sheet (player picker) ===== */
#dlg .dc.rich{width:min(800px,92vw);padding:32px 32px 24px;text-align:start;background:rgba(28,28,32,.88)}
#dlg .dc.rich h3{font-size:32px;text-align:start}#dlg .dc.rich #dlg-s{text-align:start;font-size:19px}
#dlg .dc.rich #dlg-l{gap:8px;max-height:66vh;padding:10px 2px 4px}
#dlg-l .dh{font-size:15px;font-weight:800;letter-spacing:.09em;color:var(--mu);padding:14px 10px 2px;text-transform:uppercase}
#dlg .dk.rr{display:flex;align-items:center;gap:20px;text-align:start;padding:14px 24px;border-radius:22px;background:rgba(255,255,255,.07)}
#dlg .dk.rr::after{display:none}
#dlg .dk.rr .rd{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.38);position:relative}
#dlg .dk.rr.cur .rd{border-color:#fff}
#dlg .dk.rr.cur .rd::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
#dlg .dk.rr .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
#dlg .dk.rr b{font-size:25px;font-weight:800;line-height:1.25}
#dlg .dk.rr small{font-size:17px;font-weight:500;color:var(--mu);line-height:1.35}
#dlg .dk.rr:focus{background:#fff;color:#000;transform:scale(1.015);box-shadow:none}
#dlg .dk.rr:focus small{color:#55555c}
#dlg .dk.rr:focus .rd{border-color:#000}#dlg .dk.rr:focus.cur .rd::after{background:#000}


/* === v2 fixes === */
#det .dc.cw{display:flex;flex-wrap:wrap;gap:10px;max-height:none!important;overflow:visible!important}
#det .ac{display:inline-flex;align-items:center;gap:10px;padding:4px 18px;border-radius:999px;border:2px solid transparent;background:rgba(128,128,128,.24);color:var(--tx);font-size:20px;font-weight:700;cursor:pointer;outline:none;transition:transform .12s}
#det .ac img{width:54px;height:54px;border-radius:50%;object-fit:cover;margin-inline-start:-14px;flex:none}
#det .ac:focus{border-color:#fff;background:rgba(255,255,255,.22);transform:scale(1.07)}
#act{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);overflow-y:auto;padding:5vh 5vw;display:flex;flex-direction:column;gap:2.4vh;color:#fff}
#act .a-x{align-self:flex-start;padding:8px 26px;border-radius:999px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:700 22px Cairo,Tahoma,sans-serif;cursor:pointer;outline:none}
#act .a-x:focus{background:#fff;color:#000}
#act .a-top{display:flex;gap:3vw;align-items:flex-start}
#act .a-pic{flex:none;height:44vh;max-width:30vw;aspect-ratio:2/3;object-fit:cover;border-radius:24px;background:#222}
#act .a-in{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
#act .a-n{font-size:clamp(34px,3.6vw,60px);line-height:1.2}
#act .a-m{color:#bbb;font-size:22px}
#act .a-bio{font-size:22px;line-height:1.6;color:#e6e6ea;max-height:30vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical}
#act .a-h{font-size:26px;color:var(--gold,#e8c36a)}
#act .a-row{display:flex;gap:18px;overflow-x:auto;padding:14px 8px 20px}#act .a-row::-webkit-scrollbar{height:0}
#act .a-card{flex:none;width:clamp(150px,11vw,210px);border-radius:16px;border:2px solid transparent;background:#1a1a1e;outline:none;overflow:hidden;cursor:pointer;transition:transform .12s}
#act .a-card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}

/* ===== سينما: صف 4 أفلام + فيديو بكامل الشاشة خلفها ===== */
#cin,#cin-info,#p-cin{display:none}
body.bgv #cin{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict;background:radial-gradient(ellipse at 70% 25%,#27272d 0,#050506 72%)}
body.bgv #hbg,body.bgv #pbg{display:none}
body.bgv *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.bgv #cin .sh{background:linear-gradient(to top,rgba(0,0,0,.9) 0,rgba(0,0,0,.55) 45%,rgba(0,0,0,.45) 100%)}
#cin img,#cin video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
#cin img.on{opacity:.5}#cin img.bd.on{opacity:.92}#cin video.on{opacity:1}
#cin .sh{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.94) 0,rgba(0,0,0,.72) 30%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.5) 100%)}
#ci-t{font:900 clamp(34px,3.5vw,66px)/1.18 Cairo,Tahoma,Arial,sans-serif;max-width:min(60vw,1100px);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

#ci-p{margin-top:1vh;max-width:min(52vw,960px);font-size:clamp(16px,1.2vw,22px);line-height:1.65;color:#d6d6dc;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

#page.cinp #p-l::-webkit-scrollbar{height:0}

#page.cinp .gv .li span:not(.fvb){font-size:clamp(14px,1.05vw,19px);padding:.9vh 1vh}

#ci-pos.on{display:block}#ci-tx{min-width:0}
body.bgv .pg>div{background:rgba(0,0,0,.76)}
body.bgv #page.cinp .pg>#p-l,body.bgv #page.cinp .pg>#cin-info{background:none}

#page.cinr #p-l.gv{grid-column:1!important;grid-row:2!important;display:block!important;width:100%!important;max-width:100%!important;overflow-x:hidden!important;overflow-y:auto!important;padding:0 0 4vh!important;contain:none!important}
.cin-row{margin:0 0 1.6vh}
.cin-t{font-size:clamp(22px,1.9vw,34px);font-weight:900;color:#fff;padding:.4vh 3vw 0;text-shadow:0 2px 12px rgba(0,0,0,.85);cursor:pointer}
.cin-rr{display:flex;flex-direction:row;gap:var(--gp);overflow-x:auto;overflow-y:hidden;padding:1.8vh 3vw 2.4vh;scrollbar-width:none;scroll-padding-inline:3vw}
.cin-rr::-webkit-scrollbar{display:none}
#kb{background:rgba(14,14,16,.94)!important}
#vbox{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);z-index:99999;display:none;width:min(640px,86vw);padding:20px 28px 22px;border-radius:26px;background:linear-gradient(135deg,rgba(8,20,48,.97),rgba(100,20,44,.95));border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 60px rgba(0,0,0,.65);color:#fff;text-align:center;font:800 clamp(20px,1.8vw,32px)/1.5 Cairo,Tahoma,Arial,sans-serif;pointer-events:none}
