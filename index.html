#splash .vg{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 38%,rgba(0,0,0,.85) 100%)}

#splash .ln{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(255,236,190,.95),transparent);transform:scaleX(0);animation:ln 1.3s .1s ease-out forwards}
#splash .lw{position:relative;opacity:0;transform:scale(1.14);animation:lg 1.3s .35s cubic-bezier(.2,.7,.2,1) forwards}
#splash .lw img{display:block;height:clamp(150px,30vmin,324px);width:auto}
#splash .sw{position:absolute;top:0;right:0;bottom:0;left:0;-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 140% 0/250% 100% no-repeat;animation:sw 1.1s 1.2s ease-in-out forwards}
@keyframes glow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.7;transform:scale(1.1)}}
@keyframes ln{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes lg{to{opacity:1;transform:scale(1)}}
@keyframes sw{to{background-position:-40% 0}}

/* ترجمة: تمييز الخيار اللي واقف عليه الريموت + الخيار المختار */
#sp .btn,#sp .pill,#sp .circ,#sp .ri{background:rgba(255,255,255,.07);color:var(--tx);border:2px solid var(--ln);font-weight:700;transition:transform .12s,background-color .12s,box-shadow .12s}
#sp .pill.on,#sp .ri.cur{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
#sp .ri.cur::after{content:'\2713';margin-inline-start:12px;font-weight:900}
#sp .btn:focus,#sp .pill:focus,#sp .circ:focus,#sp .ri:focus,#sp input:focus{background:rgba(255,255,255,.34)!important;color:var(--tx)!important;border-color:#fff!important;box-shadow:0 0 0 4px rgba(255,255,255,.6)!important;transform:scale(1.04);position:relative;z-index:2}
#sp .circ svg{stroke:currentColor;fill:none}
/* ExoPlayer: الواجهة شفافة فوق الفيديو الأصلي */

#xb{position:fixed;left:6vw;right:6vw;top:max(116px,11vh);display:none;flex-direction:column;align-items:center;gap:12px;direction:ltr;z-index:32;pointer-events:none;font-weight:800}

#xb-k{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 0 18px rgba(0,0,0,.8)}

/* ===== playback HUD: clean translucent card, slim bar, engine badge ===== */

/* ===== HUD v3: compact bottom bar ===== */
#xb{top:auto!important;bottom:max(22px,3.5vh);left:50%!important;right:auto!important;width:min(980px,66vw);transform:translateX(-50%);gap:8px}
#xb-j{order:-1;font-size:clamp(17px,2.3vh,26px);padding:5px 20px}

const xapi=(a,x='')=>`${S.conf.server}/player_api.php?username=${enc(S.conf.user)}&password=${enc(S.conf.pass)}&action=${a}${x}`;
function nameOf(l){let q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c=='"')q=!q;else if(c==','&&!q)return l.slice(i+1).trim()}return''}
function parseM3U(x){
 const out=[];let m=null;
 x.split(/\r?\n/).forEach(l=>{l=l.trim();
  if(l.startsWith('#EXTINF')){const g=k=>(l.match(new RegExp(k+'="([^"]*)"'))||[])[1]||'';
   m={name:nameOf(l)||g('tvg-name')||t('ch'),logo:g('tvg-logo'),group:g('group-title')||t('ungr')}}
  else if(l&&!l.startsWith('#')&&m){m.url=l;m.id='m'+out.length+'_'+m.name;out.push(m);m=null}
 });
 S.chans=out;
}
function classify(){S.live=S.chans.filter(c=>!MV.test(c.group)&&!SR.test(c.group));S.mv=S.chans.filter(c=>MV.test(c.group)&&!SR.test(c.group));S.sr=S.chans.filter(c=>SR.test(c.group))}
async function jget(u){let r;try{r=await fetch(u)}catch(e){if(!(window.HalaNative&&HalaNative.http))throw e;const x=await xhttp('GET',u,{});if(!x.status)throw e;return {ok:x.status<400,status:x.status,json:async()=>JSON.parse(x.body)}}return r}
async function check(c){
 let r;try{r=await jget(`${c.server}/player_api.php?username=${enc(c.user)}&password=${enc(c.pass)}`)}catch(e){throw new Error(t('srvdown'))}
 if(!r.ok)throw new Error(r.status==401||r.status==403?t('badlogin'):t('http',r.status));
 let j;try{j=await r.json()}catch(e){throw new Error(t('badlogin'))}
 const u=j&&j.user_info;if(!u||u.auth==0)throw new Error(t('badlogin'));
 S.mc=+u.max_connections||0;const st=String(u.status||'').toLowerCase(),ex=+u.exp_date,dd=ex?new Date(ex*1000):null,ds=dd?dd.toLocaleDateString(S.lang=='ar'?'ar-JO-u-nu-latn':'en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
 if(st=='expired'||(dd&&dd<new Date()))throw new Error(t('expd',ds));
 if(st&&st!='active')throw new Error(t('banned'));
 S.acc=t('accok',ds,dd?Math.ceil((dd-new Date())/864e5):0)+(u.max_connections?` · ${u.active_cons||0}/${u.max_connections}`:'');
}
async function load(conf){
 if(!S.cm)S.acc='';S.mc=0;
 const m=conf.mode=='m3u'&&(conf.url||'').match(/^(https?:\/\/[^\/?#]+)\/(?:get|player_api)\.php\?(.*)$/i);
 if(m){const q=new URLSearchParams(m[2]);if(q.get('username')&&q.get('password'))conf={mode:'xt',server:m[1],user:q.get('username'),pass:q.get('password')}}
 S.conf=conf;if(!S.cm){S.mv=[];S.sr=[]}
 if(conf.mode=='m3u'){
  if(!conf.url)throw new Error(t('needurl'));
  const r=await fetch(conf.url);if(!r.ok)throw new Error(t('err')+r.status);
  parseM3U(await r.text());classify();saveCache();
 }else{
  if(!conf.server||!conf.user||!conf.pass)throw new Error(t('fill'));
  await check(conf);
  const g=async a=>{const r=await jget(xapi(a));if(!r.ok)throw new Error(t('deny'));return r.json()};
  S.lv=S.cm?0:1;const cat=a=>g(a).then(l=>{const o={};(Array.isArray(l)?l:[]).forEach(x=>o[x.category_id]=x.category_name);return o}).catch(()=>({}));
  const vp=Promise.all([g('get_vod_streams'),g('get_series'),cat('get_vod_categories'),cat('get_series_categories')]);vp.catch(()=>{});
  const [c,st]=await Promise.all([g('get_live_categories'),g('get_live_streams')]);
  if(!Array.isArray(st))throw new Error(t('badacc'));
  const cm={};(c||[]).forEach(x=>cm[x.category_id]=x.category_name);
  S.chans=st.map(x=>({id:'x'+x.stream_id,name:x.name,logo:x.stream_icon,group:cm[x.category_id]||t('ungr'),url:`${conf.server}/live/${enc(conf.user)}/${enc(conf.pass)}/${x.stream_id}.m3u8`}));
  S.live=S.chans;
  vp.then(([v,s2,vc,sc])=>{
   if(Array.isArray(v))S.mv=v.map(x=>({id:'v'+x.stream_id,name:x.name,logo:x.stream_icon,group:vc[x.category_id]||t('ungr'),ts:+x.added||0,url:`${conf.server}/movie/${enc(conf.user)}/${enc(conf.pass)}/${x.stream_id}.${x.container_extension||'mp4'}`}));
   if(Array.isArray(s2))S.sr=s2.map(x=>({id:'s'+x.series_id,name:x.name,logo:x.cover,group:sc[x.category_id]||t('ungr'),ts:+x.last_modified||0,sid:x.series_id}));
   S.lv=0;saveCache();if(V()=='home'){renderSug();accUI()}else if(V()=='page')renderPage();
  }).catch(()=>{S.lv=0;if(V()=='home')accUI()});
 }
 if(!S.chans.length)throw new Error(t('nochan'));
 return conf;
}

 a.sort((x,y)=>{const p=skey(x),q=skey(y);return p.s!=q.s?R[p.s]-R[q.s]:d*NCO.compare(p.n,q.n)})}
$('#p-sort').onclick=()=>{const all=src(S.page),cur=sortMode(all);
 dlgOpen(t('sort'),'',sortOpts(all).map(m=>({t:t('so_'+m),cur:m==cur,fn:()=>{store.set('sort',m);S.limit=100;renderPage();focusEl($('#p-sort'))}})))};
/*HS-END*/


/* ===== سينما: خلفية فيديو لحظية بدون أي حمل =====
   - عنصر فيديو واحد ثابت (ما بينعمل/بيتدمّر مع كل حركة) + صورتين للـ crossfade
   - تأخير 550ms قبل أي شغل شبكة، فالتنقل السريع ما بيكلّف ولا طلب
   - مقطع 22 ثانية بس، 3 دورات وبيوقف، وبيتحرر الاتصال والـ decoder فوراً عند أي حركة/خروج/تشغيل
   - حارس أداء: لو الجهاز عم يفوّت فريمات بيوقف الفيديو لحاله ويكمّل بالصور
   - صور TMDB الأصلية بتنقلب لمقاسات صغيرة (أخف بالذاكرة والفك) */
function thumb(u,w){return(typeof u=='string'&&u.indexOf('image.tmdb.org/t/p/')>0)?u.replace(/(image\.tmdb\.org\/t\/p\/)(original|w\d+)\//,'$1'+w+'/'):u}
window.CIN=(function(){
 const A=[$('#cin-a'),$('#cin-b')],vd=$('#cin-v'),tt=$('#ci-t'),mm=$('#ci-m'),pp=$('#ci-p'),pc=$('#p-cin'),pg=$('#page');
 const CLIP=22,DWELL=250,VDELAY=1200,MC=new Map(),INF=new Map();
 let gen=0,dw=0,qt=0,ii=0,shown='',cur=null,ck=0,t0=0,loops=0,strikes=0,ft=0;
 const ar=()=>S.lang=='ar',on=()=>V()=='page'||V()=='home',cinp=()=>pg.classList.contains('cinp')&&V()=='page',user=()=>store.get('cinv')!==0;
 const hs=x=>{x=String(x||'');let h=0;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;return Math.abs(h)};
 const key=it=>it.sid?'s'+it.sid:'m'+(it.id||it.url||it.name);
 function img(u,bd){
  if(!u){A.forEach(x=>x.classList.remove('on'));shown='';return}
  if(u===shown)return;shown=u;const n=A[ii^1],o=A[ii];
  n.onload=()=>{n.onload=null;if(shown!==u)return;n.classList.toggle('bd',!!bd);n.classList.add('on');o.classList.remove('on');ii^=1};
  n.onerror=()=>{n.onerror=null;if(shown===u)shown=''};n.src=u}
 function info(it,m){
  const po=$('#ci-pos');if(po){if(it&&it.logo){const u=thumb(it.logo,'w780');if(po.getAttribute('src')!==u){po.onerror=()=>po.classList.remove('on');po.src=u}po.classList.add('on')}else{po.classList.remove('on');po.removeAttribute('src')}}
  if(!it){tt.textContent=mm.textContent=pp.textContent='';return}
  tt.textContent=cleanTitle(it.name)||it.name||'';
  const a=[];if(m&&m.year)a.push(m.year);if(m&&m.genre)a.push(m.genre);if(m&&m.rate>0)a.push('★ '+m.rate);if(!a.length&&it.group)a.push(it.group);
  mm.textContent=a.join('  •  ');pp.textContent=(m&&m.plot)||''}
 const bgc=x=>document.body.classList.toggle('bgv',!!x);
 function halt(){clearTimeout(qt);vd.classList.remove('on');vd.onloadedmetadata=vd.oncanplay=vd.onplaying=vd.ontimeupdate=vd.onerror=null;
  try{vd.pause()}catch(e){}if(vd.getAttribute('src')){vd.removeAttribute('src');vd.load()}}
 function stop(){gen++;clearTimeout(dw);halt()}
 function evict(){while(MC.size>80)MC.delete(MC.keys().next().value)}
 async function fetchMeta(it,fk){
  const m={u:it.url||'',bd:'',plot:'',year:'',genre:'',rate:0};
  if(S.conf&&S.conf.mode=='xt'){
   try{
    const id=it.sid||String(it.id).slice(1),sr=fk=='sr'||!!it.sid;
    const r=await Promise.race([jget(sr?xapi('get_series_info','&series_id='+id):xapi('get_vod_info','&vod_id='+id)),new Promise((_,j)=>setTimeout(j,7000))]);
    const j=await r.json(),i=j.info||{},b=i.backdrop_path||i.backdrop;
    m.bd=(Array.isArray(b)?b[0]:b)||'';m.plot=String(i.plot||i.description||'');
    m.year=String(i.releasedate||i.releaseDate||i.release_date||'').slice(0,4);m.genre=String(i.genre||'').split(/[,،\/]/).slice(0,3).join(' • ').trim();
    m.rate=Math.round((parseFloat(i.rating)||0)*10)/10;
    if(sr&&!m.u){if(SPU[id])m.u=SPU[id];else{const ks=Object.keys(j.episodes||{}).sort((x,y)=>x-y),ep=ks.length&&j.episodes[ks[0]]&&j.episodes[ks[0]][0];
     if(ep){m.u=`${S.conf.server}/series/${enc(S.conf.user)}/${enc(S.conf.pass)}/${ep.id}.${ep.container_extension||'mp4'}`;SPU[id]=m.u}}}
   }catch(e){}
  }
  return m}
 function meta(it,fk){const k=key(it),c=MC.get(k);if(c)return Promise.resolve(c);
  let p=INF.get(k);if(!p){p=fetchMeta(it,fk).then(m=>{MC.set(k,m);evict();INF.delete(k);return m});INF.set(k,p)}return p}
 function play(u,it,g){
  loops=0;vd.defaultMuted=false;vd.muted=false;vd.volume=1;vd.preload='auto';vd.src=u;
  vd.onloadedmetadata=()=>{if(g!==gen)return;const d=vd.duration;let s=0;
   if(isFinite(d)&&d>CLIP*2.5)s=Math.min(d*(.12+(hs(key(it))%13)/100),d-CLIP-8);
   t0=s;if(s>1){try{vd.currentTime=s}catch(e){}}};
  vd.oncanplay=()=>{if(g===gen&&vd.paused&&loops<3){vd.muted=false;vd.volume=1;vd.play().catch(()=>{setTimeout(()=>{if(g===gen&&vd.paused){vd.muted=false;vd.play().catch(()=>{})}},500)})}};
  vd.onplaying=()=>{if(g!==gen)return;vd.muted=false;vd.volume=1;vd.classList.add('on');guard(g);audChk(vd,g,()=>gen)};
  vd.ontimeupdate=()=>{if(g!==gen)return;if(vd.currentTime>t0+CLIP){if(++loops>=3){vd.pause();return}try{vd.currentTime=t0}catch(e){}}};
  vd.onerror=()=>{if(g===gen)vd.classList.remove('on')}}
 function guard(g){clearTimeout(qt);qt=setTimeout(()=>{if(g!==gen||vd.paused)return;
  try{const q=vd.getVideoPlaybackQuality();if(q.totalVideoFrames>60&&q.droppedVideoFrames/q.totalVideoFrames>.25){
   if(++strikes>=2){store.set('cinv',0);halt();pill();osd(ar()?'الجهاز ما قدر يشغّل الفيديو بسلاسة، تم إيقافه تلقائياً (بتقدر ترجّعه من الزر)':'Video preview turned off: this device could not keep up')}}}catch(e){}},3500)}
 async function settle(it,fk,g){
  if(g!==gen||!on())return;
  const m=await meta(it,fk);if(g!==gen||!on())return;
  info(it,m);if(m.bd)img(thumb(m.bd,'original'),true);
  const u=m.u||it.url;
  if(!user()||!BGOK||!u||/\.m3u8?(\?|$)/i.test(u))return;
  const w=VDELAY-(Date.now()-ft);if(w>0)await new Promise(r=>setTimeout(r,w));
  if(g!==gen||!on())return;
  play(u,it,g)}
 function focus(it,fk){
  if(!on())return;if(fk=='lv'&&!cinp()){hide();return}const g=++gen;clearTimeout(dw);halt();cur=it;ck=fk;ft=Date.now();if(user())bgc(1);
  const c=MC.get(key(it));info(it,c);
  const bd=c&&c.bd,iu=bd?thumb(bd,'original'):(it.logo?thumb(it.logo,'original'):null);if(iu)img(iu,!!bd);
  if(fk=='lv')return;
  dw=setTimeout(()=>settle(it,fk,g),DWELL)}
 function pill(){if(!pc)return;const o=user();pc.textContent=ar()?('🎬 الفيديو: '+(o?'شغّال':'متوقف')):('🎬 Video: '+(o?'On':'Off'))}
 if(pc)pc.onclick=()=>{const o=user();store.set('cinv',o?0:1);strikes=0;pill();if(o){halt();if(!cinp())bgc(0)}else if(cur&&on())focus(cur,ck);const b=$('#p-cin');b&&b.focus({preventScroll:true})};
 $('#p-l').addEventListener('focusin',e=>{const r=e.target.closest('.li');if(r&&r._it&&on())focus(r._it,r._fk)});
 $('#home').addEventListener('focusin',e=>{const r=e.target.closest('.cd,.hero');if(!r||!r._it||!on())return;if(r._fk=='mv'||r._fk=='sr')focus(r._it,r._fk);else hide()});
 $('#home').addEventListener('click',stop,true);
 $('#p-l').addEventListener('click',stop,true);   /* قبل ما يبدأ المشغّل: حرّر الاتصال والـ decoder */
 let lastV=V();new MutationObserver(()=>{const v=V();if(v!=lastV){lastV=v;hide()}}).observe(document.body,{attributes:true,attributeFilter:['data-v']});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(cur&&on())focus(cur,ck)});
 function hide(){stop();img(null);info(null);cur=null;bgc(0)}
 return{focus,stop,pill,hide,active(){return user()&&BGOK&&on()}}
})();

/* ===== أول ما يفتح ===== */
S.lang=store.get('lang')||'ar';S.name=store.get('name')||'';applyLang();
if(S.name)$('#nm').value=S.name;
try{const lc=window.HalaNative&&HalaNative.lastCrash&&HalaNative.lastCrash();if(lc)elog('ANDROID: '+lc)}catch(e){}
const saved=store.get('conf');
if(PAIR){setView('pair');applyLang();focusEl($('#pr-n'))}else if(saved){if(!S.name){S.name=store.get('name')||'Hala'}
 const fresh=()=>load(saved).then(showHome).catch(()=>{setView('login');$('#err').textContent=t('savedfail');startPair()});
 idb.get('lists').then(c=>{if(c&&c.sig===JSON.stringify(saved)&&c.chans&&c.chans.length&&c.conf){S.conf=c.conf;S.chans=c.chans;S.live=c.chans;S.mv=c.mv||[];S.sr=c.sr||[];S.lv=0;S.acc=c.acc||'';S.cm=1;showHome();load(saved).then(()=>{S.cm=0;if(V()=='home')renderHome()}).catch(e=>{S.cm=0;elog('refresh: '+(e&&e.message))})}else fresh()}).catch(fresh)}else{focusEl($('.lg.on'));startPair()}
</script>
