#p-l:not(.gv)>.li.lv:focus .cg{background:rgba(128,128,128,.25);color:var(--ov)}
html.mob #p-l:not(.gv)>.li.lv{min-height:64px;gap:10px;padding:8px 12px}
html.mob #p-l:not(.gv)>.li.lv img,html.mob #p-l:not(.gv)>.li.lv.nl::after{width:76px}
html.mob #p-l:not(.gv)>.li.lv .cg{display:none}

html.mob,html.mob body{font-size:16px;line-height:1.45;overscroll-behavior:none}
html.mob #login{padding:max(env(safe-area-inset-top),14px) 14px max(env(safe-area-inset-bottom),14px)}
html.mob .card0{width:100%;border-radius:24px;padding:20px 16px}
html.mob .card0 .ruq{font-size:clamp(34px,10vw,56px)}
html.mob .card0 .tab,html.mob .card0 .btn,html.mob .card0 input{font-size:17px;padding:12px 16px;min-height:48px;border-radius:14px}
html.mob input,html.mob select{font-size:17px;min-height:48px}
html.mob #home{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding:max(env(safe-area-inset-top),14px) 16px max(env(safe-area-inset-bottom),18px);gap:4px}
html.mob header{flex-direction:column;align-items:stretch;gap:10px}
html.mob #hi{font-size:clamp(26px,7.4vw,40px)}
html.mob #sub{font-size:15px}
html.mob .nav{flex-direction:row;height:auto;min-height:0;gap:10px;margin-top:14px}
html.mob .tile{flex:1;min-height:96px;max-height:130px;border-radius:18px}
html.mob .tile .lb{flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:6px;text-align:center}
html.mob .tile .ic{font-size:30px}
html.mob .tile .ruq{font-size:clamp(17px,4.8vw,22px)}
html.mob .tile small{font-size:13px}
html.mob .hero{flex:none;height:190px;border-radius:20px}
html.mob .sug{flex-direction:column;gap:10px}
html.mob .tw{min-width:0;width:100%;padding:12px 16px}
html.mob .rch h3{font-size:19px}
html.mob .pill,html.mob .circ{min-height:44px;min-width:44px}
html.mob #page{height:100%;overflow-y:auto;padding:max(env(safe-area-inset-top),12px) 14px max(env(safe-area-inset-bottom),14px)}
html.mob .ph{gap:10px}
html.mob .ph h2{font-size:clamp(24px,6.5vw,34px)}
html.mob .ph input{width:100%;flex:1 1 100%;font-size:17px;min-height:48px;border-radius:14px}
html.mob .li{min-height:60px;font-size:17px}
html.mob #set{padding:max(env(safe-area-inset-top),12px) 14px max(env(safe-area-inset-bottom),16px);gap:10px;flex-wrap:nowrap}
html.mob #set .btn{width:100%;font-size:17px;padding:13px 16px;min-height:52px;border-radius:14px}
html.mob #set input{width:100%;font-size:17px}
html.mob .sh3{font-size:18px}
html.mob .sug{flex:none;height:auto;min-height:0;justify-content:flex-start;align-items:stretch;overflow:visible}
html.mob .tile:focus,html.mob .hero:focus{transform:none}
html.mob #set{flex-direction:column;align-items:stretch;flex-wrap:nowrap}
html.mob body[data-v=set] #set{display:grid;grid-template-columns:1fr;align-content:start;gap:10px}
html.mob #set .sh3,html.mob #set>div,html.mob #set>h3{grid-column:1/-1}
@media(orientation:landscape) and (max-height:520px){html.mob .nav{margin-top:8px}html.mob .tile{min-height:76px}html.mob .tile .lb{flex-direction:row;gap:10px;justify-content:center}html.mob .hero{height:150px}html.mob #hi{font-size:26px}}
@media(min-width:700px){html.mob #home,html.mob #page,html.mob #set{padding-inline:max(5vw,24px)}html.mob .tile{max-height:160px}html.mob .tile .ruq{font-size:26px}html.mob .tile .ic{font-size:40px}html.mob #set .btn{width:100%}html.mob body[data-v=set] #set{grid-template-columns:1fr 1fr}}
html.mob #home .tile.rctile{flex:1;height:auto;min-height:96px;max-height:130px;aspect-ratio:auto}

/* v-fix: settings groups, note card, update dot */
#st-w input,#st-w .sgi{grid-column:1/-1;max-width:900px}
#st-w .sgi{margin:0;min-height:1.4em}
.wd.nt{flex:1 1 100%;padding:12px 22px;gap:6px;border-inline-start:6px solid var(--hi);background:var(--sf)}
.wd.nt b{font-size:22px}
.wd.nt ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 26px}
.wd.nt li{font-size:17px;color:var(--tx)}.wd.nt li::before{content:'• ';color:var(--mu)}
#b-set.updot{position:relative}#b-set.updot::after{content:'';position:absolute;top:4px;inset-inline-end:4px;width:14px;height:14px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 2px var(--bg)}
#upb{cursor:pointer}
</style>

  if(S.conf&&S.conf.mode=='xt'){
   try{
    const id=it.sid||String(it.id).slice(1),sr=fk=='sr'||!!it.sid;
    const r=await Promise.race([jget(sr?xapi('get_series_info','&series_id='+id):xapi('get_vod_info','&vod_id='+id)),new Promise((_,j)=>setTimeout(j,7000))]);
    const j=await r.json(),i=j.info||{},b=i.backdrop_path||i.backdrop;
    m.bd=(Array.isArray(b)?b[0]:b)||'';m.plot=String(i.plot||i.description||'');
    m.year=String(i.releasedate||i.releaseDate||i.release_date||'').slice(0,4);m.genre=String(i.genre||'').split(/[,،\/]/).slice(0,3).join(' • ').trim();
    m.rate=Math.round((parseFloat(i.rating)||0)*10)/10;
    if(sr&&!m.u){if(SPU[id])m.u=SPU[id];else{const ks=Object.keys(j.episodes||{}).sort((x,y)=>x-y),ep=ks.length&&j.episodes[ks[0]]&&j.episodes[ks[0]][0];
     if(ep){m.u=`${S.conf.server}/series/${enc(S.conf.user)}/${enc(S.conf.pass)}/${ep.id}.${ep.container_extension||'mp4'}`;SPU[id]=m.u}}}
   }catch(e){}
  }
  return m}
 function meta(it,fk){const k=key(it),c=MC.get(k);if(c)return Promise.resolve(c);
  let p=INF.get(k);if(!p){p=fetchMeta(it,fk).then(m=>{MC.set(k,m);evict();INF.delete(k);return m});INF.set(k,p)}return p}
 function play(u,it,g){
  loops=0;vd.defaultMuted=false;vd.muted=false;vd.volume=1;vd.preload='auto';vd.src=u;
  vd.onloadedmetadata=()=>{if(g!==gen)return;const d=vd.duration;let s=0;
   if(isFinite(d)&&d>CLIP*2.5)s=Math.min(d*(.12+(hs(key(it))%13)/100),d-CLIP-8);
   t0=s;if(s>1){try{vd.currentTime=s}catch(e){}}};
  vd.oncanplay=()=>{if(g===gen&&vd.paused&&loops<3){vd.muted=false;vd.volume=1;vd.play().catch(()=>{setTimeout(()=>{if(g===gen&&vd.paused){vd.muted=false;vd.play().catch(()=>{})}},500)})}};
  vd.onplaying=()=>{if(g!==gen)return;setTimeout(()=>{if(g===gen&&!vd.videoWidth)halt()},4500);vd.muted=false;vd.volume=1;vShow(vd,()=>{if(g===gen)vd.classList.add('on')});guard(g);audChk(vd,g,()=>gen)};
  vd.ontimeupdate=()=>{if(g!==gen)return;if(vd.currentTime>t0+CLIP){if(++loops>=3){vd.pause();return}try{vd.currentTime=t0}catch(e){}}};
  vd.onerror=()=>{if(g===gen)vd.classList.remove('on')}}
 function guard(g){clearTimeout(qt);qt=setTimeout(()=>{if(g!==gen||vd.paused)return;
  try{const q=vd.getVideoPlaybackQuality();if(q.totalVideoFrames>60&&q.droppedVideoFrames/q.totalVideoFrames>.25){
   if(++strikes>=2){store.set('cinv',0);halt();pill();osd(ar()?'الجهاز ما قدر يشغّل الفيديو بسلاسة، تم إيقافه تلقائياً (بتقدر ترجّعه من الزر)':'Video preview turned off: this device could not keep up')}}}catch(e){}},3500)}
 async function settle(it,fk,g){
  if(g!==gen||!on())return;
  const pf=it.logo?thumb(it.logo,'w780'):'',mp=meta(it,fk);let hd=false;
  const give=(u,fb)=>{if(g!==gen||!on()||!u)return false;hd=true;img(u,true,fb);return true};
  if(TKEY()){await Promise.race([tmdbBd(it,fk,u=>give(u,pf)),new Promise(r=>setTimeout(r,3500))])}   /* TMDB أول ما يرجع بيعرض الصورة، من غير ما ينتظر السيرفر */
  if(g!==gen||!on())return;
  const m=await mp;if(g!==gen||!on())return;
  info(it,m);
  if(!hd){if(m.bd)give(thumb(m.bd,'w1280'),pf);else if(pf)img(pf,false);else img(null)}
  warm(g);
  const u=m.u||it.url;
  if(!user()||!BGOK||!u||it.sid||/\.m3u8?(\?|$)/i.test(u))return;
  const w=VDELAY-(Date.now()-ft);if(w>0)await new Promise(r=>setTimeout(r,w));
  if(g!==gen||!on())return;
  play(u,it,g)}
 function focus(it,fk){
  if(!on())return;if(V()=='det'&&cur===it&&ck===fk&&!vd.paused&&vd.getAttribute('src')){if(user())bgc(1);return}if(fk=='lv'&&!cinp()&&V()!='det'){hide();return}const g=++gen;clearTimeout(dw);halt();cur=it;ck=fk;ft=Date.now();if(user())bgc(1);
  const c=MC.get(key(it));info(it,c);
  const kk=key(it),hd=BDL[kk]||BD.get(kk)||'',bd=c&&c.bd,pf=it.logo?thumb(it.logo,'w780'):'',nk=!TKEY()||BD.get(kk)==='';if(hd)img(hd,true,pf);else if(nk){if(bd)img(thumb(bd,'w1280'),true,pf);else if(c&&pf)img(pf,false)}
  if(fk=='lv')return;
  dw=setTimeout(()=>settle(it,fk,g),DWELL)}
 function pill(){if(!pc)return;const o=user();pc.textContent=ar()?('🎬 الفيديو: '+(o?'شغّال':'متوقف')):('🎬 Video: '+(o?'On':'Off'))}
 if(pc)pc.onclick=()=>{const o=user();store.set('cinv',o?0:1);strikes=0;pill();if(o){halt();if(!cinp())bgc(0)}else if(cur&&on())focus(cur,ck);const b=$('#p-cin');b&&b.focus({preventScroll:true})};
 $('#p-l').addEventListener('focusin',e=>{const r=e.target.closest('.li');if(r&&r._it&&on()){curEl=r;focus(r._it,r._fk)}});
 $('#home').addEventListener('focusin',e=>{const r=e.target.closest('.cd,.hero');if(!r||!r._it||!on())return;if(r._fk=='mv'||r._fk=='sr'){curEl=r;focus(r._it,r._fk)}else hide()});
 $('#home').addEventListener('click',stop,true);
 $('#p-l').addEventListener('click',stop,true);   /* قبل ما يبدأ المشغّل: حرّر الاتصال والـ decoder */
 let lastV=V();new MutationObserver(()=>{const v=V();if(v!=lastV){lastV=v;if(v!='det')hide()}}).observe(document.body,{attributes:true,attributeFilter:['data-v']});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(cur&&on())focus(cur,ck)});
 function hide(){stop();img(null);info(null);cur=null;bgc(0)}
 return{focus,stop,pill,hide,active(){return user()&&BGOK&&on()}}

 idb.get('lists').then(c=>{if(c&&c.sig===JSON.stringify(saved)&&c.chans&&c.chans.length&&c.conf){S.conf=c.conf;S.chans=c.chans;S.live=c.chans;S.mv=c.mv||[];S.sr=c.sr||[];S.lv=0;S.acc=c.acc||'';S.cm=1;showHome();prewarm();const fr=()=>{S.cm=1;load(saved).then(()=>{S.cm=0;if(V()=='home')renderHome()}).catch(e=>{S.cm=0;elog('refresh: '+(e&&e.message))})};if(c.ts&&Date.now()-c.ts<2*36e5){setTimeout(()=>{if(V()!='app')fr()},45000)}else setTimeout(fr,6000)}else fresh()}).catch(fresh)}else{focusEl($('.lg.on'));startPair()}
