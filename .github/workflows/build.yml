name: Build Hala TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check required files
        run: |
          for f in index.html build.sh logo.png; do
            [ -f "$f" ] || { echo "::error::Missing $f in the repo root"; exit 1; }
          done

      - name: Build APK
        env:
          APP_VER: ${{ github.run_number }}
          OS_KEY: ${{ secrets.OS_KEY }}
          OS_USER: ${{ secrets.OS_USER }}
          OS_PASS: ${{ secrets.OS_PASS }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          SUB_SRV: ${{ secrets.SUB_SRV }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hala-tv-apk
          path: hala-tv.apk

      - name: Publish release (used by in-app updater)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hala TV v${{ github.run_number }}
          files: hala-tv.apk
