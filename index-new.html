<style>
:root{--cd:rgba(20,20,22,.9);--ip:#0a0a0a;--ov:#000;--sf:rgba(20,20,22,.7);--bg:#000;--pn:#0c0c0c;--ln:#2a2a2c;--tx:#fff;--mu:#8e8e93;--gold:#fff;--hi:#fff;--mar:#fff}

button,input{font:inherit;color:inherit}:focus{outline:none}

/* دخول */

.lg{padding:clamp(6px,1.3vh,14px) 36px;border:2px solid var(--ln);border-radius:999px;cursor:pointer;background:var(--ip);font-size:clamp(20px,3vh,30px)}.lg.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.tabs{display:flex;gap:14px;margin-bottom:clamp(12px,2.4vh,26px)}

/* رئيسية */

#rcv-art.fi{-webkit-animation:rcfi .4s ease-out;animation:rcfi .4s ease-out}@-webkit-keyframes rcfi{from{opacity:0}to{opacity:1}}@keyframes rcfi{from{opacity:0}to{opacity:1}}
.rcv-top{position:absolute;top:2.4vh;left:4vw;right:4vw;display:flex;align-items:center;gap:16px}#rcv-hd{flex:1;font-size:clamp(20px,2vw,32px);font-weight:900;color:var(--gold)}
.rcv-info{position:absolute;top:13vh;width:52vw}html[dir=rtl] .rcv-info{right:6vw}html[dir=ltr] .rcv-info{left:6vw}

.rcv-act{display:flex;gap:1vw;margin-top:3vh;flex-wrap:wrap}
#rcv .rcb{font-size:clamp(17px,1.5vw,24px);font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.18)}
#rcv .rcv-play{background:#fff;color:#111}
#rcv .rcb:focus{background:#fff;color:#000;-webkit-transform:scale(1.08);transform:scale(1.08);box-shadow:0 0 0 4px rgba(255,255,255,.35)}
#rcv-b{position:absolute;left:0;right:0;top:63vh;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:30vh}#rcv-b::-webkit-scrollbar{display:none}
.rcv-rt{font-size:clamp(20px,1.9vw,30px);font-weight:800;padding:0 4vw;margin:0;line-height:1.5}
.rcv-rw{display:flex;gap:1.1vw;overflow-x:auto;overflow-y:hidden;padding:10px 4vw 14px;scrollbar-width:none}.rcv-rw::-webkit-scrollbar{display:none}
.rcv-nt{padding:0 4vw 6px;color:var(--mu);font-size:clamp(15px,1.4vw,22px)}
#rcv .rcc{height:24vh;width:16vh}#rcv .rcc:focus{-webkit-transform:scale(1.09);transform:scale(1.09);border-color:#fff}
.rcc .bd{position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,.72);padding:1px 9px;border-radius:8px;font-size:clamp(12px,1.05vw,17px);font-weight:800}.rcc .bd.nw{background:var(--gold);color:#111}html[dir=rtl] .rcc .bd{left:auto;right:8px}
html.ph #rcv-art{display:none}html.ph .rcv-info{width:88vw;left:6vw;right:6vw}
/* مقترحات لك */
#home{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}#home::-webkit-scrollbar{display:none}#home>*{flex-shrink:0}
.rch{display:flex;align-items:center;gap:16px;margin-top:2.4vh}.rch h3{font-size:clamp(24px,2.2vw,36px);color:var(--gold);font-weight:700;margin-inline-end:14px}
.rcb{font-size:clamp(17px,1.5vw,24px);font-weight:700;color:inherit;font-family:inherit}
.rcr{display:flex;gap:1.1vw;overflow-x:auto;overflow-y:hidden;padding:14px 8px 22px;scrollbar-width:none;min-height:25vh}.rcr::-webkit-scrollbar{display:none}
.rcc{flex:none;position:relative;width:16.7vh;height:25vh;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#2a2a2d,#0a0a0a);border:2px solid transparent;cursor:pointer;transition:transform .12s ease-out,box-shadow .12s}

.rcc .rcn b{display:block;font-weight:700}.rcc .rcn small{display:block;color:rgba(255,255,255,.75);font-size:.8em;margin-top:2px}
.rcc:focus{transform:scale(1.07) translateY(-6px);border-color:var(--hi);box-shadow:0 18px 40px rgba(0,0,0,.6);z-index:3}
.rce{color:var(--mu);font-size:clamp(17px,1.6vw,26px);padding:6vh 8px}
html.ph .rcc{width:133px;height:200px}html.ph .rcr{min-height:200px}
@keyframes tvon{from{opacity:.4}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#home.tvon{animation:none}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
#hi{font-size:clamp(50px,6.4vw,104px);line-height:1.15}
#sub{color:var(--mu);font-size:24px;max-width:46ch;margin-top:4px}

.cd{flex:1;position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#2a2a2d,#0a0a0a);border:2px solid transparent;cursor:pointer;transition:transform .18s,box-shadow .18s}

.none{color:var(--mu);padding:16px 4px;font-size:20px}
.pill{background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:8px 26px;cursor:pointer;backdrop-filter:blur(8px)}

.tile{flex:1;position:relative;overflow:hidden;border-radius:26px;border:2px solid rgba(255,255,255,.08);cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .18s,box-shadow .18s}

/* ===== ميزات جديدة ===== */
.sug{height:39vh}

.cwc{position:relative;display:flex;align-items:center;gap:12px;width:clamp(260px,19vw,360px);height:clamp(64px,8vh,88px);padding:6px 12px 10px;border-radius:18px;background:rgba(128,128,128,.14);border:2px solid transparent;overflow:hidden;cursor:pointer;transition:transform .12s}

.cwc:focus{background:var(--hi);color:var(--ov);transform:scale(1.05)}.cwc:focus small{color:var(--ov)}
#ld{position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;background:#05060a;opacity:1;transition:opacity .45s ease;pointer-events:none;overflow:hidden;text-align:center}
#ld.on{display:flex}#ld.out{opacity:0}
/* NOTE: 'inset' shorthand is unsupported on older Android TV WebViews (<87) -> layer collapsed to 0x0 so art was tiny and animation never rendered. Explicit offsets used instead. */
#ld img.ldb{display:block;position:absolute;top:-2vh;left:-2vw;width:20vw;height:19vh;object-fit:cover;-webkit-filter:blur(7px) saturate(1.4);filter:blur(7px) saturate(1.4);-webkit-transform:scale(5.4);transform:scale(5.4);-webkit-transform-origin:0 0;transform-origin:0 0;opacity:0;transition:opacity .6s ease}
#ld img.ldb.ld-on{opacity:.5}
#ld.pc{align-items:flex-start;text-align:start}
html[dir=rtl] #ld.pc{padding-right:36vw;padding-left:6vw}html[dir=ltr] #ld.pc{padding-left:36vw;padding-right:6vw}
#ld.pc img.ldp{z-index:3;top:50%;bottom:auto;width:37.3vh;height:56vh;margin-top:-28vh;border-radius:16px;object-fit:cover;box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.14)}
html[dir=rtl] #ld.pc img.ldp{right:7vw;left:auto}html[dir=ltr] #ld.pc img.ldp{left:7vw;right:auto}
#ld.pc .ldo{background:rgba(0,0,0,.18)}
#ld.pc .ldt,#ld.pc .lds{text-align:start;max-width:none;padding:0;z-index:4}#ld.pc .ldt{font-size:clamp(30px,7.4vh,86px)}#ld.pc img.ldl{max-width:50vw;z-index:4}
#ld .ldt{display:block;max-height:40vh;overflow:hidden;font-weight:900;letter-spacing:.01em;text-shadow:0 0 34px rgba(255,205,90,.28),0 4px 28px rgba(0,0,0,.92)}
#ld.on:not(.out) .ldt.ld-pulse{-webkit-animation:hbeat 1.9s ease-in-out infinite;animation:hbeat 1.9s ease-in-out infinite}
html[dir=rtl] #ld.pc .ldt.ld-pulse,html[dir=rtl] #ld.pc img.ldl{-webkit-transform-origin:100% 50%;transform-origin:100% 50%}html[dir=ltr] #ld.pc .ldt.ld-pulse,html[dir=ltr] #ld.pc img.ldl{-webkit-transform-origin:0 50%;transform-origin:0 50%}
#ld img.ldp{position:absolute;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;object-fit:cover;object-position:50% 50%;opacity:0;transition:opacity .5s ease;-webkit-transform:translateZ(0);transform:translateZ(0)}
#ld img.ld-on{opacity:1}
#ld .ldo{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.28)}
#ld .ldt{position:relative;max-width:78vw;padding:0 4vw;font-weight:900;font-size:clamp(34px,8vh,96px);line-height:1.2;color:#fff;text-shadow:0 4px 28px rgba(0,0,0,.9)}
#ld img.ldl{position:relative;max-width:56vw;max-height:28vh;object-fit:contain;opacity:0;transition:opacity .5s ease;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
#ld img.ldl.ld-on{opacity:1}
#ld.on:not(.out) img.ldl.ld-on,#ld.on:not(.out) img.ldp.ld-on.hb{-webkit-animation:hbeat 1.9s ease-in-out infinite;animation:hbeat 1.9s ease-in-out infinite}
#ld img.ldp.hb{-webkit-animation-name:hbeatp;animation-name:hbeatp}
#ld .lds{position:relative;margin-top:2.2vh;font-size:clamp(16px,3vh,30px);color:rgba(255,255,255,.75);font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.9)}
@-webkit-keyframes hbeat{0%,16%,34%,100%{-webkit-transform:translateZ(0) scale(1)}8%{-webkit-transform:translateZ(0) scale(1.09)}26%{-webkit-transform:translateZ(0) scale(1.05)}}
@keyframes hbeat{0%,16%,34%,100%{transform:translateZ(0) scale(1)}8%{transform:translateZ(0) scale(1.09)}26%{transform:translateZ(0) scale(1.05)}}
@-webkit-keyframes hbeatp{0%,16%,34%,100%{-webkit-transform:translateZ(0) scale(1)}8%{-webkit-transform:translateZ(0) scale(1.03)}26%{-webkit-transform:translateZ(0) scale(1.018)}}
@keyframes hbeatp{0%,16%,34%,100%{transform:translateZ(0) scale(1)}8%{transform:translateZ(0) scale(1.03)}26%{transform:translateZ(0) scale(1.018)}}
#bf{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:bfs .9s linear infinite;display:none;z-index:7;pointer-events:none}@keyframes bfs{to{transform:rotate(360deg)}}
#st-logt{display:none;grid-column:1/-1;white-space:pre-wrap;direction:ltr;text-align:left;font-size:15px;color:var(--mu);max-height:30vh;overflow:hidden}#st-logt.on{display:block}
#upb{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:90;background:var(--hi);color:var(--ov);padding:10px 26px;border-radius:999px;font-weight:700;font-size:clamp(16px,1.4vw,24px);display:none}

/* --- شريط الحروف أنحف + ترك مساحة أكبر للعناوين --- */

/* --- شاشة الافتتاح (سينمائية خفيفة: transform/opacity فقط، بدون blur) --- */
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .vg{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 38%,rgba(0,0,0,.85) 100%)}
#splash .gl{position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.5) 0%,rgba(255,200,110,.2) 32%,rgba(0,0,0,0) 68%);opacity:0;animation:glow 2.6s ease-out forwards}
#splash .ln{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(255,236,190,.95),transparent);transform:scaleX(0);animation:ln 1.3s .1s ease-out forwards}
#splash .lw{position:relative;opacity:0;transform:scale(1.14);animation:lg 1.3s .35s cubic-bezier(.2,.7,.2,1) forwards}
#splash .lw img{display:block;height:clamp(150px,30vmin,324px);width:auto}
#splash .sw{position:absolute;top:0;right:0;bottom:0;left:0;-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 140% 0/250% 100% no-repeat;animation:sw 1.1s 1.2s ease-in-out forwards}
@keyframes glow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.7;transform:scale(1.1)}}
@keyframes ln{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes lg{to{opacity:1;transform:scale(1)}}
@keyframes sw{to{background-position:-40% 0}}

/* ===== سينما: صف 4 أفلام + فيديو بكامل الشاشة خلفها ===== */
#cin,#cin-info,#p-cin{display:none}
body.bgv #cin{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict;background:radial-gradient(ellipse at 70% 25%,#27272d 0,#050506 72%)}
body.bgv #hbg,body.bgv #pbg{display:none}
body.bgv *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.bgv #cin .sh{background:linear-gradient(to top,rgba(0,0,0,.9) 0,rgba(0,0,0,.55) 45%,rgba(0,0,0,.45) 100%)}
#cin img,#cin video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
#cin img.on{opacity:.5}#cin img.bd.on{opacity:.92}#cin video.on{opacity:1}
#cin .sh{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.94) 0,rgba(0,0,0,.72) 30%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.5) 100%)}
#ci-t{font:900 clamp(34px,3.5vw,66px)/1.18 Cairo,Tahoma,Arial,sans-serif;max-width:min(60vw,1100px);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ci-m{margin-top:.6vh;font-size:clamp(17px,1.4vw,26px);color:#e9e9ee;font-weight:700}
#ci-p{margin-top:1vh;max-width:min(52vw,960px);font-size:clamp(16px,1.2vw,22px);line-height:1.65;color:#d6d6dc;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
/* أداء: ممنوع blur فوق فيديو شغّال (بيعيد رسم كل فريم) */
body[data-v=page] #page.cinp *,body[data-v=home] #home *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#page.cinp{--cw:23vh;--gp:1.8vh}
#page.cinp #pbg{display:none}
#page.cinp #p-cin{display:inline-block}
#page.cinp .pg.gvw{grid-template-rows:minmax(0,1fr) auto}
#page.cinp .pg.gvw #p-g{grid-column:1;grid-row:1/3}
#page.cinp .pg.gvw #p-a{grid-column:2;grid-row:1/3}

#page.cinp #ci-t{font-size:clamp(26px,2.6vw,48px)}
#page.cinp #p-l.gv{grid-column:3;grid-row:2;display:flex!important;flex-direction:row;align-items:center;gap:var(--gp);overflow-x:auto!important;overflow-y:hidden!important;padding:2.4vh var(--gp) 3vh!important;width:calc(4*var(--cw) + 5*var(--gp));max-width:100%;justify-self:start;contain:layout style;background:none!important;border:0!important}
#page.cinp #p-l::-webkit-scrollbar{height:0}
#page.cinp .gv .li{flex:0 0 var(--cw)!important;width:var(--cw)!important;margin:0!important;border-radius:2vh;content-visibility:auto;contain-intrinsic-size:var(--cw) calc(var(--cw)*1.5)}
#page.cinp .gv .li span:not(.fvb){font-size:clamp(14px,1.05vw,19px);padding:.9vh 1vh}
#page.cinp .gv .li:focus{transform:scale(1.08);border-color:#fff;box-shadow:0 0 0 .45vh #fff,0 1.6vh 3.2vh rgba(0,0,0,.65)}
#ci-pos{display:none;flex:none;height:min(28vh,300px);aspect-ratio:2/3;object-fit:cover;border-radius:1.6vh;box-shadow:0 1.4vh 3vh rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2)}
#ci-pos.on{display:block}#ci-tx{min-width:0}
body.bgv .pg>div{background:rgba(0,0,0,.76)}
body.bgv #page.cinp .pg>#p-l,body.bgv #page.cinp .pg>#cin-info{background:none}
body.bgv .ph .pill,body.bgv .ph input{background:rgba(0,0,0,.68);border-color:rgba(255,255,255,.16)}
body.bgv .ph .pill:focus{background:var(--hi);color:var(--ov)}
body.bgv .tile{background:rgba(0,0,0,.62)!important}
#kb{background:rgba(14,14,16,.94)!important}
#vbox{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);z-index:99999;display:none;width:min(640px,86vw);padding:20px 28px 22px;border-radius:26px;background:linear-gradient(135deg,rgba(8,20,48,.97),rgba(100,20,44,.95));border:1px solid rgba(255,255,255,.28);box-shadow:0 20px 60px rgba(0,0,0,.65);color:#fff;text-align:center;font:800 clamp(20px,1.8vw,32px)/1.5 Cairo,Tahoma,Arial,sans-serif;pointer-events:none}
#vbox.on{display:block}
#vbars{display:flex;gap:5px;justify-content:center;align-items:center;height:56px;margin-top:10px}
#vbars i{display:block;width:9px;height:6px;border-radius:5px;background:#ff453a;transition:height .09s linear}
#vbox.pr #vbars i{background:#9aa3b5;animation:vpr 1s ease-in-out infinite}
@keyframes vpr{50%{height:30px}}
#vbox .vh{font-size:.62em;font-weight:600;opacity:.85;margin-top:6px;word-break:break-word}
</style>

/* ===== قصة هلا (About) — مشهد سينمائي ===== */
#about{display:none;height:100%;overflow-y:auto;overflow-x:hidden;position:relative;z-index:2;background:#000;color:#fff;--p:0;scroll-behavior:smooth}
body[data-v=about] #about{display:block}
.ab-bg{position:fixed;inset:0;z-index:0;background:#000;pointer-events:none}
.ab-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:66% 30%;opacity:calc(1 - var(--p)*.62);filter:blur(calc(var(--p)*5px)) saturate(calc(1 - var(--p)*.25));transform:scale(calc(1.02 + var(--p)*.05));will-change:opacity,transform}
.ab-vg{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(0,0,0,.78) 78%,#000 100%),radial-gradient(ellipse at 60% 35%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
#about .pill{position:fixed;top:3.2vh;inset-inline-start:4vw;z-index:6;background:rgba(0,0,0,.42);color:#fff;border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(10px)}
#about .pill:focus{background:#fff;color:#000;border-color:#fff}
.ab-hero{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;padding:0 6vw 11vh}
#about[dir=rtl] .ab-hero{align-items:flex-end}#about[dir=ltr] .ab-hero{align-items:flex-start}
.ab-hero>*{max-width:46vw}
#about[dir=ltr] .ab-t{font-size:clamp(44px,5.4vw,100px)}
.ab-hero>*{animation:abIn 1.6s cubic-bezier(.2,.7,.2,1) both}
.ab-hero>:nth-child(2){animation-delay:.25s}.ab-hero>:nth-child(3){animation-delay:.5s}.ab-hero>:nth-child(4){animation-delay:.9s}
@keyframes abIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.ab-k{font-family:Cairo,Tahoma,Arial,sans-serif;letter-spacing:.35em;font-size:clamp(14px,1.3vw,22px);color:rgba(255,255,255,.8);margin-bottom:10px;text-transform:uppercase}
.ab-t{font-family:Cairo,Tahoma,Arial,sans-serif;font-weight:800;font-size:clamp(52px,7vw,130px);line-height:1.15;margin:0;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.7)}
.ab-s{margin:14px 0 0;font-size:clamp(18px,1.9vw,32px);color:rgba(255,255,255,.88);text-shadow:0 2px 20px rgba(0,0,0,.8)}
.ab-cue{margin-top:22px;font-size:clamp(26px,2.4vw,40px);color:rgba(255,255,255,.7);animation:abIn 1.6s 1.2s both,abBob 2.2s 2.8s ease-in-out infinite}
@keyframes abBob{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.ab-story{position:relative;z-index:2;padding:12vh 6vw 16vh;background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,.82) 140px,#000 300px)}
.ab-col{max-width:880px;margin:0 auto}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s ease}
.rv.in{opacity:1;transform:none}
.abo{text-align:center;font-family:Cairo,Tahoma,Arial,sans-serif;color:rgba(255,255,255,.78);font-size:clamp(20px,1.9vw,34px);margin:0 auto 7vh;padding-bottom:4vh;position:relative}
.abo:after,.abq:before{content:"";display:block;width:90px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);margin:3.4vh auto 0}
.abp{padding:18px 26px;border-radius:22px;border:1px solid transparent;margin:0 0 5vh;outline:none}
.abp:focus{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.abn{font-family:Cairo,Tahoma,Arial,sans-serif;font-size:clamp(18px,1.6vw,28px);letter-spacing:.3em;color:rgba(255,255,255,.5);margin-bottom:6px}
.abp h4{margin:0 0 12px;font-family:Cairo,Tahoma,Arial,sans-serif;font-weight:700;font-size:clamp(26px,2.4vw,42px);color:#fff;line-height:1.3}
.abp p{margin:0;line-height:2.05;font-size:clamp(19px,1.65vw,29px);color:rgba(255,255,255,.86)}
.abq{text-align:center;margin-top:9vh}
.abq:before{margin:0 auto 5vh}
.abq p{font-family:Cairo,Tahoma,Arial,sans-serif;font-weight:600;font-size:clamp(23px,2.2vw,38px);line-height:2;color:#fff;margin:0}
.abq .sg1{display:block;margin-top:6vh;color:rgba(255,255,255,.65);font-size:clamp(16px,1.35vw,24px)}
.abq .sg2{display:block;margin-top:8px;font-family:Cairo,Tahoma,Arial,sans-serif;font-weight:800;font-size:clamp(28px,2.8vw,48px);color:#fff}
.abq .sg3{display:block;margin-top:14px;letter-spacing:.45em;color:rgba(255,255,255,.4);font-size:clamp(12px,1vw,16px);padding-inline-start:.45em}

 [`همّ كل مشاهد`,`ومنذ زمن بعيد وأنا من عشّاق الأفلام والمسلسلات والقنوات، أقضي معها ساعات من الأنس والمعرفة. غير أني، كما يعلم كل مشاهد، لقيتُ من المشغّلات المتعثّرة والتطبيقات المتفرّقة ما أتعب الصبر وأضاع الوقت.`],

 [`هدية من القلب`,`فعقدتُ العزم أن يكون هذا العمل هديةً له، وهديةً لكل بيت يحب أن يشاهد براحة. فبنيتُه على ما كان يبحث عنه المشاهد الحقيقي منذ زمن: السرعة، والترتيب، وسهولة الاستخدام، بلا تعقيد ولا فوضى.`]

 [`Every viewer’s concern`,`For a long time I have been devoted to films, series and channels, spending hours of joy and discovery with them. Yet, as every viewer knows, I met with faltering players and scattered apps that tested my patience and wasted my time.`],
